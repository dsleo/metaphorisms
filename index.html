.grid-bp{display:none} body.blueprint .grid-bp{display:inline}

body.atlas .grain,body.riso .grain{display:block}
.styles{display:flex;flex-direction:column;align-items:center;gap:8px;padding:9px 0;margin-bottom:4px;width:40px;background:var(--panel);border:1px solid var(--panel-line);border-radius:9px}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid var(--panel-line);padding:0;cursor:pointer;background:linear-gradient(135deg,var(--a) 0 50%,var(--b) 50% 100%);position:relative}
.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.sw:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.zoom button.sw{width:24px;height:24px;border-radius:50%;border:1px solid var(--panel-line);padding:0;box-shadow:none;background:linear-gradient(135deg,var(--a) 0 50%,var(--b) 50% 100%)}
.zoom button.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
@media (min-width:721px){ .zoom{transition:right .25s} .panel.open ~ .zoom{right:392px} }
.zoom{position:absolute}
#stylebtn svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.stylemenu{position:absolute;right:52px;bottom:0;background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:6px;min-width:190px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.stylemenu[hidden]{display:none}
.zoom .sopt{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;height:auto;border:0;border-radius:7px;background:transparent;color:var(--ink);font:500 14px/1.2 "CMU Serif",system-ui,sans-serif;padding:8px 10px;text-align:left;cursor:pointer}
.zoom .sopt:hover{background:var(--rhover)}
.zoom .sopt:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
.zoom .sopt[aria-checked="true"]{font-weight:600}
.zoom .sopt[aria-checked="true"]::after{content:"✓";margin-left:auto;color:var(--link)}
.swd{width:18px;height:18px;border-radius:50%;flex:none;border:1px solid var(--panel-line);background:linear-gradient(135deg,var(--a) 0 50%,var(--b) 50% 100%)}
.titlebar{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:2;text-align:center;pointer-events:none;width:max-content;max-width:calc(100% - 40px);transition:left .25s}
.titlebar h1{margin:0;font:700 28px/1.15 "CMU Serif",system-ui,sans-serif;letter-spacing:-.015em;color:var(--ink);text-shadow:0 0 14px var(--bg),0 0 4px var(--bg)}
body.mono .titlebar h1{font-weight:500;font-size:24px}
.titlebar .crumb{pointer-events:auto;display:inline-block;margin-top:8px;font-size:13px;background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;padding:4px 12px}
.titlebar .crumb[hidden]{display:none}
@media (min-width:721px){ .panel.open ~ .titlebar{left:calc((100% - 380px)/2)} }
@media (max-width:720px){ .titlebar h1{font-size:19px} .titlebar{top:calc(12px + env(safe-area-inset-top,0px))} }
.zoom button svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.zoom button{display:inline-flex;align-items:center;justify-content:center}
#searchbtn{position:relative}
#searchbtn.active::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.searchpop{position:absolute;right:52px;top:0;width:300px;background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.searchpop[hidden]{display:none}
.searchpop input{width:100%;font:400 15px "CMU Serif",system-ui,sans-serif;padding:9px 11px;border:1px solid var(--panel-line);border-radius:7px;background:transparent;color:var(--ink)}
.searchpop input::placeholder{color:var(--muted)}
.searchpop input:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.searchpop .status{font-size:12.5px;color:var(--muted);margin:6px 2px 0}
.searchpop .status:empty{display:none}
@media (max-width:720px){ .searchpop{width:min(300px,calc(100vw - 80px))} }
.panel h2,.panel p.desc,.imgs h4,.imgs p,.tip b{letter-spacing:0}
.imgs h4{font-weight:500}
.panel h2{font-weight:700;letter-spacing:-.01em}
.dtag{font-weight:500}
/* Computer Modern: serif for reading, sans for small controls */
.zoom button,.zoom .sopt,.searchpop input,.searchpop .status,.tip span,.small,.ptag,.panel .sub,.meta .sub,.crumb,.backlink{font-family:"CMU Sans Serif",system-ui,sans-serif}
.titlebar h1{font:400 33px/1.15 "CMU Serif",Georgia,serif;letter-spacing:0}
body.mono .titlebar h1{font-family:"CMU Typewriter Text",ui-monospace,monospace;font-size:28px}
.panel h2{font-family:"CMU Serif",Georgia,serif;font-weight:700;letter-spacing:0;font-size:24px}
.imgs h4{font-weight:700;font-size:17.5px}

.panel li button{font-family:"CMU Serif",Georgia,serif;font-size:16px}
.dtag{font-family:"CMU Serif",Georgia,serif;font-size:15px;font-weight:400}

.tools{display:flex;flex-direction:column;gap:6px}
.tools[hidden]{display:none}
#toolsbtn svg{transition:transform .3s}

#toolsbtn{position:relative}
#toolsbtn.active::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
@media (prefers-reduced-motion: reduce){ #toolsbtn svg{transition:none} }
.ttl{display:flex;align-items:flex-start;gap:8px}

.row:has(.status:empty):has(.crumb[hidden]){display:none}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"CMU Serif",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;overflow:hidden;transition:background .3s}

.ft{fill:var(--top)} .fl{fill:var(--left)} .fr{fill:var(--right)}

.win{fill:var(--win);stroke:var(--line-soft);stroke-width:.5}
.winlit{fill:var(--winlit);stroke:none}

.grass{fill:var(--grass);stroke:var(--line-faint);stroke-width:.6}

.awn1{fill:var(--acc);stroke:var(--line);stroke-width:.6} .awn2{fill:var(--top);stroke:var(--line);stroke-width:.6}

.dlabel{font-family:var(--label-font);font-style:var(--label-style);font-weight:var(--label-weight);fill:var(--line);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-linejoin:round;cursor:pointer;transition:opacity .3s}

.bld{cursor:pointer;transition:opacity .3s}

.bld.dim,.deco.dim{opacity:.15}
.kinbeam{fill:none;stroke:var(--hover);stroke-width:1.2;stroke-dasharray:3 5;pointer-events:none}

.leader.show,.leaderdot.show{opacity:1}

.shadow *{fill:var(--line)!important;stroke:none!important;opacity:.16}

.sensor{fill:none;stroke:var(--hover);stroke-width:1.1;stroke-dasharray:3 3}
.sqd{fill:var(--sqd);stroke:none}

.hedge{fill:none;stroke:var(--hedge);stroke-width:5;stroke-linecap:round}
.tether{fill:none;stroke:var(--line-soft);stroke-width:.8;stroke-dasharray:1.5 4}

.awn-b .fr{fill:var(--acc)}
.leader{stroke:var(--line-soft);stroke-width:1;stroke-dasharray:2 3;fill:none}
.leaderdot{fill:var(--acc)}
.crumb{font-size:13px;color:var(--ink);min-height:1.3em}
.backlink{font-size:13px;margin:0 34px 10px 0;display:inline-block}
/* ---------- chrome ---------- */
.top{position:absolute;left:16px;top:16px;right:16px;display:flex;pointer-events:none;z-index:2}
.brand{pointer-events:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:12px 14px;max-width:420px;width:100%}
.brand h1{font-family:"CMU Serif",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;font-size:21px;line-height:1.15;margin:0 0 8px}

.brand input{width:100%;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--panel-line);border-radius:7px;background:transparent;color:var(--ink)}
.brand input::placeholder{color:var(--muted)}
.brand input:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.status{font-size:13px;color:var(--muted);min-height:1.3em}
.seg{display:inline-flex;border:1px solid var(--panel-line);border-radius:7px;overflow:hidden;flex:none}
.seg button{font:inherit;font-size:12.5px;padding:5px 9px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:focus-visible{outline:2px solid var(--link);outline-offset:-2px}

.zoom{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:40px;height:40px;border:1px solid var(--panel-line);border-radius:9px;background:var(--panel);color:var(--ink);font:500 20px/1 "CMU Serif",sans-serif;cursor:pointer}
.zoom button.fit{font-size:12px}
.zoom button:focus-visible{outline:2px solid var(--link);outline-offset:2px}

.panel{position:absolute;right:16px;top:16px;width:360px;max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:18px 18px 16px;z-index:3;display:none}
.panel.open{display:block}
.panel .close{position:absolute;right:10px;top:10px;width:32px;height:32px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;border-radius:6px}
.panel .close:focus-visible{outline:2px solid var(--link)}
.ptag{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin:0 34px 8px 0}
.ptag svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.panel h2{font-family:"CMU Serif",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;font-size:23px;line-height:1.2;margin:0 0 8px}
.panel p.desc{font-family:"CMU Serif",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16.5px;line-height:1.55;margin:0 0 14px}
.meta{border-top:1px solid var(--panel-line);padding-top:12px;font-size:14px}
.meta a{color:var(--link);text-underline-offset:2px}
.meta .who{font-weight:600}
.meta .sub,.sub{color:var(--muted);font-size:13px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--link);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.linkbtn:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.panel h3{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.panel ul{list-style:none;margin:0;padding:0}
.panel li{margin:0 0 2px}
.panel li button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px;border-radius:6px;font:inherit;color:var(--ink);cursor:pointer}
.panel li button:hover{background:var(--rhover)}

.panel li button:focus-visible{outline:2px solid var(--link)}
.track{width:56px;height:5px;border-radius:3px;background:var(--panel-line);flex:none;overflow:hidden}
.bar{display:block;height:100%;background:var(--acc)}
.small{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.hint{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--panel-line);padding:6px 10px;border-radius:7px;z-index:1;max-width:min(520px,calc(100% - 90px))}

@media (max-width:720px){
  .top{left:10px;right:10px;top:10px}
  .brand{max-width:none}
  .brand h1{font-size:18px}
  .panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:58%;border-radius:14px 14px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.sky-q{display:none} body.quanta .sky-q{display:inline}

/* phones: drop the costly full-screen effects */
@media (max-width:720px){ .grain{display:none!important} body.neon #objects,body.neon #air{filter:none} .bld{transition:none} }

":"economy","b":"grief","texts":1,"j":0.08}],"rows":[{"c":"terrain","t":"Unmapped jungle","d":"Pure mathematics as lifelong exploration of a wilderness harder than the Dari\u00e9n Gap: mapping terrain, finding resources to fund expeditions, building gadgets.","a":"Christian Szegedy","s":"szegedy","k":"essay"},{"c":"terrain","t":"Rocks that become mountains","d":"Conjectures are rocks climbed mostly to test climbing tools; rarely one turns out to be a majestic mountain with a view over the whole terrain.","a":"Christian Szegedy","s":"szegedy","k":"essay"},{"c":"terrain","t":"Flags planted on rocks","d":"AI labs proudly planted flags on rocks explorers were already close to summiting, which upset the explorers.","a":"Christian Szegedy","s":"szegedy","k":"essay"},{"c":"terrain","t":"Satellites and mining","d":"Cheap planes bring satellites that map the whole terrain for deposits; extraction will be messy and corporate.","a":"Christian Szegedy","s":"szegedy","k":"essay"},{"c":"terrain","t":"Mansion with no floor plans","d":"Teams wander dark corridors forcing stuck doors; once one opens, someone reinforces the ceiling, turns on a light, and relays word to whoever draws the map.","a":"Emily Riehl","s":"riehl","k":"essay"},{"c":"terrain","t":"Library of Babel","d":"A library holding proofs of every ZFC theorem plus guides; a mathematician inside would still get to work, because the goal is understanding.","a":"Daniel Litt","s":"littBabel","k":"essay"},{"c":"terrain","t":"Clinging to a giant edifice","d":"Research as feeling out a huge structure, bashing your skull into an object until its texture imprints on your forehead.","a":"Daniel Litt","s":"littBabel","k":"essay"},{"c":"terrain","t":"Natural boundary","d":"Machines will stop at some boundary where the next leap is not worth the resources; humans then journey to where they stopped.","a":"Kevin Buzzard","s":"buzzard","k":"essay"},{"c":"terrain","t":"Lighthouses in the night","d":"An open question is a lighthouse guiding mathematicians' wanderings; don't use our most beautiful conjectures as mere benchmarks.","a":"Hugo Duminil-Copin","s":"duminil","k":"essay"},{"c":"terrain","t":"Oceans between lemma and breakthrough","d":"An ocean separates a technical lemma from a serious paper, another from a breakthrough, and several more from Fields-level work.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"terrain","t":"Surveying new continents","d":"AI may let young \u201cintuition-maxxers\u201d survey entire new continents at a pace that mystifies their elders.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"terrain","t":"A narrow ridge","d":"Between a bright AI-assisted future and churning out pointless papers ever faster lies a narrow ridge.","a":"Pierre Marion","s":"marion","k":"essay"},{"c":"terrain","t":"Helicopter to the summit, or to Narnia","d":"Using AI on old problems is a helicopter to a familiar summit; real discovery would be a helicopter into a strange, fertile Narnia.","a":"Reader on Sahai's post","s":"sahai","k":"comment"},{"c":"terrain","t":"The Alaskan hike","d":"Let AI book the flight for your backpacking trip, not take the hike for you and send pictures.","a":"Jeremy Avigad","s":"avigad","k":"essay"},{"c":"speed","t":"Wright brothers' airplane","d":"AI in mathematics is at the twelve-second-flight stage: primitive, expensive, improving fast. Don't bet against the airplane.","a":"Christian Szegedy","s":"szegedy","k":"essay"},{"c":"speed","t":"Object approaching light speed","d":"Not an airplane we fly but something accelerating away from us, receding from sight as it nears light speed.","a":"Justin Asher","s":"asher","k":"essay"},{"c":"speed","t":"Faster than you can steer","d":"Driving faster than you can run is fine, not faster than you can steer; AI multiplies the \u201ccontrol points\u201d that need skilled humans.","a":"Po-Shen Loh","s":"loh","k":"essay"},{"c":"speed","t":"Airline pilots","d":"Learn from professions like airline pilots that faced automation-driven skill erosion; LLMs as a superpower PhD students must learn to pilot.","a":"Pierre Marion","s":"marion","k":"essay"},{"c":"speed","t":"Ferrari at the marathon","d":"Using AI is like showing up to a marathon in a Ferrari, or with steroids; cars got their own sport, Formula 1.","a":"Reader on Antieau's post","s":"antieau","k":"comment"},{"c":"speed","t":"Self-driving levels","d":"Autoformalization is no more a full solution than Tesla's Full Self-Driving; proposes a Mathematical Intelligence Scale like self-driving levels.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"build","t":"Builder and explorer","d":"Grothendieck's builder of new houses versus Szegedy's explorer; soon AI does both, and we feel like children again.","a":"Justin Asher","s":"asher","k":"essay"},{"c":"build","t":"Foundations under stress test","d":"Like the 1900\u20131930 crisis in foundations, but now the implicit framework of values and practices is being stress-tested.","a":"Terence Tao","s":"tao","k":"essay"},{"c":"build","t":"Monorepo and canonization","d":"Mathlib as a coherent monorepo that autoformalization depends on; canonization turns one-off formalizations into library mathematics.","a":"Alex Kontorovich","s":"kontorovich","k":"essay"},{"c":"build","t":"Mathlib versus Mathslop","d":"Formal math splits into an intelligible layer and an unintelligible one; an autoformalized proof sits as an orphaned 200,000-line blob.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"economy","t":"The theorem economy","d":"Theorems are the only currency that puts bread on the table; research mathematicians risk being demonetized.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"economy","t":"The Overhang","d":"The latent value of connecting existing results, like unrealized capital gains of past creativity, which LLMs are placed to harvest.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"economy","t":"Honor code and Hardy's curse","d":"Prove theorems and shut up; \u201cthe first rule of the Intuition Club\u201d; a big conjecture as cryptographic proof of conceptual innovation.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"economy","t":"Product recall","d":"Mathematics sold a bogus idea of itself to billions; repositioning the brand may be the largest product recall in memory.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"economy","t":"Technical debt","d":"Math slop creates technical debt that someone else must pay, worse than in software because the answer alone is rarely the point.","a":"Henry Cohn","s":"cohn","k":"essay"},{"c":"economy","t":"Proof scarcity and abundance","d":"Institutions built for scarce proofs will misbehave in an era of proof abundance.","a":"Terence Tao","s":"tao","k":"essay"},{"c":"economy","t":"Slot machine for conjectures","d":"Outputs are now mispriced; the dominant career strategy becomes pulling the slot-machine lever on conjectures.","a":"Daniel Litt","s":"littEnd","k":"essay"},{"c":"economy","t":"The price of a nice dinner","d":"Some basic questions can now be resolved for the marginal cost of a nice dinner, and we should be delighted.","a":"Daniel Litt","s":"littBeg","k":"essay"},{"c":"economy","t":"Mathematics as commodity","d":"Mathematics becomes a commodity produced on demand.","a":"Justin Asher","s":"asher","k":"essay"},{"c":"economy","t":"Collapse of the h-index","d":"Producing papers becomes a commodity, so their value for hiring and evaluation collapses.","a":"Pierre Marion","s":"marion","k":"essay"},{"c":"body","t":"Proof indigestion","d":"Impedance mismatches, or less flatteringly proof indigestion, all along the pipeline from generation to canonicalization.","a":"Terence Tao","s":"tao","k":"essay"},{"c":"body","t":"Friction sanded away","d":"Over-polished AI proofs sand away the natural friction that tells a reader where to slow down.","a":"Terence Tao","s":"tao","k":"essay"},{"c":"body","t":"Atrophying organs","d":"Organs of the community like MathOverflow are atrophying, cannibalized by Discord and then AI.","a":"Daniel Litt","s":"littEnd","k":"essay"},{"c":"religion","t":"Priest, then monk","d":"Mathematicians become priests interpreting revelation from on high, then monks meditating on truths beyond their horizon.","a":"Logan Graves","s":"graves","k":"essay"},{"c":"religion","t":"Silicon Leviathan and its Siren call","d":"AI labs as a Hobbesian Leviathan; accepting a certificate without demonstration is the bargain where authority, not truth, makes the law.","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"religion","t":"Clergy, laity, and Lean as Latin","d":"Truths held on authority again: the prover's owners are the clergy, and the language the laity cannot read is Lean.","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"religion","t":"Certificate of an unvisited monument","d":"A 616,000-line Lean proof is a reliable document about a monument no one has visited.","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"religion","t":"Enlightenment twilight","d":"The Enlightenment bound itself to the mast of mathematics; the ship entering turbulent waters threatens the whole project (Aufkl\u00e4rungsd\u00e4mmerung).","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"religion","t":"Subhuman superintelligence","d":"Less than human in humanitas, more than human in speed; its builders cast as alchemists.","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"religion","t":"Revealed truth","d":"An unreadable AI Lean proof as a \u201crevealed\u201d truth, unquestionable and undemocratic (comment summarizing Gamburd).","a":"Kevin Buzzard","s":"buzzard","k":"essay"},{"c":"war","t":"Commons and enclosure","d":"Open literature is a commons and frontier models its enclosure; guarding work leads to a \u201cMiddle Ages in reverse.\u201d","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"war","t":"Bloodless sword","d":"Withholding acceptance is the community's only weapon, the one sword the Leviathans cannot forge for themselves.","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"war","t":"Weil's three monsters","d":"Money, mechanisation and algebra fused into one body.","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"war","t":"Rhetoric of colonial progress","d":"Inevitability talk about an AI takeover of math echoes 19th-century colonial rhetoric of progress.","a":"Michael Harris","s":"harris","k":"essay"},{"c":"war","t":"Occupation and collaborators","d":"Advisors helping a company eat us slower; Cassandra's fate; pulling up the ladder to rule a land with no children.","a":"Vladimir Lazi\u0107","s":"lazic","k":"essay"},{"c":"war","t":"The Diggers' song","d":"A 17th-century commons movement's song rewritten as \u201cYou noble eggheads all\u201d against tech barons.","a":"Anonymous postdoc","s":"diggers","k":"essay"},{"c":"war","t":"Cossacks at the gates","d":"Under agentic swarms we are all second-rate minds; we can do little about the Cossacks at the gates (Fiddler on the Roof).","a":"Ethan Sussman","s":"sussman","k":"essay"},{"c":"war","t":"Bulldozers, battering rams, nukes","d":"Conjectures fall to bulldozers and battering rams; AI discoveries decapitate fields and nuke the landscape.","a":"Hugo Duminil-Copin","s":"duminil","k":"essay"},{"c":"war","t":"Radioactive wasteland","d":"AI companies will bomb formalization into a wasteland that can never sustain life again (Patrick Massot, quoted).","a":"David Bessis","s":"bessis","k":"essay"},{"c":"war","t":"Caliper to a gunfight","d":"Also: a fox thanking the hens for the henhouse keys, collective seppuku, a \u201cnuclear scenario\u201d for the Riemann hypothesis.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"war","t":"Manhattan Project","d":"Co-authoring with AI labs is the Manhattan Project of our time; playing with fire; the sandbox is a cage.","a":"Max Weinreich","s":"weinreich","k":"essay"},{"c":"war","t":"Die on that hill","d":"Scholze will not use AI and will die on that hill (quoted).","a":"Kevin Buzzard","s":"buzzard","k":"essay"},{"c":"grief","t":"Five stages of grief","d":"Denial, anger, bargaining and depression all well represented in the community.","a":"Kevin Buzzard","s":"buzzard","k":"essay"},{"c":"grief","t":"Graduation","d":"Mathematics is about to graduate; the emptiness after the last competition.","a":"Christian Szegedy","s":"szegedy","k":"essay"},{"c":"grief","t":"Pandemic that kills mathematicians","d":"The literature survives but nobody can read it; with AI, most of math could become like forgotten areas nobody reads.","a":"Timothy Gowers","s":"gowersLeiden","k":"essay"},{"c":"grief","t":"Rug pulled out; ship sailed","d":"Seeing an AI one-shot a beloved problem felt like the rug pulled from under his feet; for classical automated proving, that ship has sailed.","a":"Timothy Gowers","s":"gowersLeiden","k":"essay"},{"c":"grief","t":"Stars without astronomers' names","d":"Theorems detached from mathematicians might be no worse than stars not named after astronomers.","a":"Timothy Gowers","s":"gowersLeiden","k":"essay"},{"c":"grief","t":"Requiem for a field","d":"Tsimerman's Fields Medal profile reads like a requiem (quoting Kevin Hartnett).","a":"Peter Woit","s":"woit","k":"essay"},{"c":"games","t":"Go, chess and Move 37","d":"Kasparov's and Lee Sedol's confident dismissals; the board for mathematics is infinite.","a":"Justin Asher","s":"asher","k":"essay"},{"c":"games","t":"A closed system like Go","d":"Hinton calls math a closed system like Go and chess; if AI \u201cwins,\u201d the only loser left is human thought.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"games","t":"Wimbledon versus the U.S. Open","d":"Tradition, white clothes and etiquette versus a louder, more democratic, more open future.","a":"Steven Strogatz","s":"strogatz","k":"essay"},{"c":"games","t":"Sudoku on a changing board","d":"Not ever more sudokus: the board changes shape and dimension; the team just got a superstar new player.","a":"Kevin Buzzard","s":"buzzard","k":"essay"},{"c":"games","t":"Chess where everyone has an engine","d":"Not like chess after Deep Blue, but chess where everyone secretly uses a program.","a":"Peter Woit","s":"woit","k":"essay"},{"c":"games","t":"Novice relaying grandmasters' moves","d":"AI-written, AI-digested math reduces humans to the messenger who relays moves between two grandmasters.","a":"Max Weinreich","s":"weinreich","k":"essay"},{"c":"games","t":"Endgame tablebases","d":"Chess ignored superhuman tablebase mates via the 50-move rule; math could ignore results humans can't verify.","a":"Reader on Sahai's post","s":"sahai","k":"comment"},{"c":"games","t":"Search tree and a nose","d":"LLMs explore many low-probability branches and get lucky; humans may keep an edge where the search tree needs pruning by nose.","a":"Timothy Gowers","s":"gowersLLM","k":"essay"},{"c":"games","t":"AlphaZero test, Stockfish","d":"Sarnak's AlphaZero test; the Navier\u2013Stokes run was Stockfish, not AlphaZero.","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"games","t":"Olympics and Formula 1","d":"If robots outrun humans, do we cancel the Olympics? F1 already exists alongside them.","a":"Po-Shen Loh","s":"loh","k":"essay"},{"c":"food","t":"Fast food, slow food","d":"Fast math and slow math as two modalities, borrowed from the slow food movement.","a":"Reader on Antieau's post","s":"antieau","k":"comment"},{"c":"food","t":"Blenders and the gym","d":"Robots outlift us yet we go to the gym; blenders outchew us yet we don't eat through straws.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"food","t":"IKEA versus artisanal theorems","d":"Affordable consistent output versus handmade furniture; perhaps an appetite for artisanal theorems.","a":"Timothy Gowers","s":"gowersLeiden","k":"essay"},{"c":"food","t":"Tailor and sewing machine","d":"Refusing AI like a tailor refusing a sewing machine; rebutted with Japanese artisan jeans.","a":"Vladimir Lazi\u0107","s":"lazic","k":"essay"},{"c":"food","t":"AI vegetarian, AI vegan","d":"Natural versus artificial mathematics, as dietary identities; proofs that \u201cgrow on trees.\u201d","a":"Max Weinreich","s":"weinreich","k":"essay"},{"c":"machines","t":"Doesn't compile in the brain","d":"Unintelligible proofs are meaningless because they don't compile on the only hardware that can appreciate them.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"machines","t":"Samplers and sequencers","d":"AI may do for math what samplers did for music; standing on the shoulders of giant machines.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"machines","t":"Monkey enumerating ZFC","d":"A computer or monkey applying deduction rules from the axioms shows proving theorems is not the goal.","a":"Daniel Litt","s":"littBeg","k":"essay"},{"c":"machines","t":"Lab science with agents","d":"Human mathematicians directing compute, doing lab science with agents.","a":"Daniel Litt","s":"littEnd","k":"essay"},{"c":"machines","t":"A proof with a hole is a poof","d":"Also HAL 9000 and WALL-E's AUTO, and a backlash like Three Mile Island or Chernobyl.","a":"Po-Shen Loh","s":"loh","k":"essay"},{"c":"machines","t":"A baby controlling its mother","d":"Hinton's only example of a less intelligent thing controlling a more intelligent one (quoted).","a":"Po-Shen Loh","s":"loh","k":"essay"},{"c":"machines","t":"Colleague down the hall","d":"AI fills the missing colleague at a small college; stronger, and perhaps stranger, tools.","a":"Jennifer Taback","s":"taback","k":"essay"},{"c":"machines","t":"Lean as source of truth","d":"Decrypting Lean into English; \u201ctheoremmaxxing\u201d; a smart kid who's an expert in the field.","a":"Kevin Buzzard","s":"buzzard","k":"essay"},{"c":"machines","t":"Low-hanging fruit","d":"AI results so far are low-hanging fruit needing no extensive new theory.","a":"Bruce Schneier and Kasra Rafi","s":"schneier","k":"essay"},{"c":"machines","t":"Assembly versus source code","d":"Mathematicians make proofs readable as source code is to assembly; AI is Hilbert's program, humans G\u00f6del's theorem.","a":"Po-Shen Loh","s":"loh","k":"essay"},{"c":"machines","t":"Telescopes and colliders","d":"AI as scientific instrument: correspondence telescopes, counterexample colliders, the denominator fallacy.","a":"Timothy Gowers","s":"gowersLeiden","k":"essay"},{"c":"cosmos","t":"Pascal's sphere","d":"Mathematics as an infinite sphere; beyond human understanding, inscrutable trophies of alien intelligence; LLMs doing math for a nascent civilization.","a":"Reader on Antieau's post","s":"antieau","k":"comment"},{"c":"cosmos","t":"Infinity beats exponential","d":"Mathematics is infinite, which beats exponential growth hands down.","a":"Kevin Buzzard","s":"buzzard","k":"essay"},{"c":"cosmos","t":"Deployable intellectual reserve","d":"Mathematicians as a reserve humanity can call on, e.g. to vet an AI-designed terawatt fusion plant.","a":"Reader on Sahai's post","s":"sahai","k":"comment"},{"c":"cosmos","t":"Exams set by aliens","d":"Bleaker if math were problems imposed by aliens; past \u201calien\u201d technologies; Twain's exaggerated death.","a":"Jeremy Avigad","s":"avigad","k":"essay"},{"c":"cosmos","t":"Conjecture falling in the woods","d":"If a conjecture falls in the woods and no one hears it, who cares?","a":"Daniel Litt","s":"littBeg","k":"essay"},{"c":"maths","t":"Within the convex hull","d":"Jokingly proposes that mathematicians say a result is within the convex hull of what is known instead of calling it trivial. It is the image behind the claim that AI only explores the region spanned by existing mathematics.","a":"Acer (@AcerFur)","s":"acerHull","k":"tweet","h":"Posts at the corners of a taut rope enclosing a field, with a few points inside the boundary."},{"c":"maths","t":"The generated subgroup","d":"Replying to the convex hull idea, Gowers asks why AI's mathematics would not be more like the subgroup generated by existing mathematical knowledge, the closure of what is known under combination. He stresses it is only a metaphor, not a claim of group structure.","a":"Timothy Gowers","s":"gowersHull","k":"tweet","h":"A core token with rings of products spreading outward in a web."},{"c":"grief","t":"The Mathocalypse","d":"Names the sudden wave of AI-solved problems a Mathocalypse, an apocalypse for the field, with a friend's joke about the machines coming for one problem after another.","a":"Scott Aaronson","s":"aaronsonMathocalypse","k":"essay","h":"Ruined skyline under a red sky."},{"c":"economy","t":"Aladdin\u2019s cave","d":"The flood of new results is a hoard of treasures from Aladdin's cave: dazzling, plentiful, and still to be sorted through and valued.","a":"Scott Aaronson","s":"aaronsonMathocalypse","k":"essay","h":"A cave mouth spilling coins and gems."},{"c":"cosmos","t":"Alien proofs","d":"A colleague's notes call the new proof some alien craziness, and say there is much to learn from the aliens: the proofs read as made by another civilization.","a":"Scott Aaronson","s":"aaronsonMathocalypse","k":"essay","h":"A strange spired structure that looks landed from elsewhere."},{"c":"terrain","t":"Resort next to the rainforest","d":"Mathematicians are like a hunter-gatherer expert in surviving the rainforest, when a giant resort hotel with heated pools opens beside him; he adapts by guiding tourists through the wilderness.","a":"Scott Aaronson","s":"aaronsonMathocalypse","k":"essay","h":"A hut at the edge of a forest beside a glass hotel."},{"c":"terrain","t":"Teleported to a mountain peak","d":"Quoting Quanta's image: AI drops you on a mountain peak in fog with no map and no equipment, without the climb that would have taught you the terrain.","a":"Scott Aaronson","s":"aaronsonMathocalypse","k":"essay","h":"A summit in fog with a tiny figure on top."},{"c":"speed","t":"The accelerating AImobile","d":"In a reply, he warns of losing human hands at the wheel of this accelerating AImobile just when more are needed.","a":"Scott Aaronson","s":"aaronsonMathocalypse","k":"essay","h":"A car with no driver speeding down a track."},{"c":"cosmos","t":"AI as a telescope on Platonic worlds","d":"A reader argues mathematics is turning empirical: mathematicians become scientists wielding AI as a telescope pointed at new and disturbing alien worlds in the Platonic realm.","a":"Readers on Aaronson's post","s":"aaronsonReaders","k":"comment","h":"An observatory dome aimed at an unknown planet."}],"S":{"szegedy":{"t":"Is Mathematics Over, or Just Graduating?","u":"https://docs.google.com/document/d/e/2PACX-1vTSh-pyNP3Gi99WMmsinnLmE9V5CDI0HEm6WGbIPMNt3V5SGlClHF8-BetotKHOImrvQDSXmFdiOw8D/pub","d":"2026-10-03"},"asher":{"t":"Math, accelerating toward light speed","u":"https://justinasher.me/math-approaching-light-speed","d":"2026-10-05"},"tao":{"t":"Mathematics in the age of AI (arXiv 2608.16753)","u":"https://arxiv.org/abs/2608.16753","d":"2026-08-17"},"marion":{"t":"The Future of Research in the Age of AI","u":"https://pierremarion23.github.io/thoughts/2026-10-01.html","d":"2026-10-01"},"littEnd":{"t":"The End of Mathematics","u":"https://www.daniellitt.com/blog/2026/8/11/the-end-of-mathematics/","d":"2026-08-11"},"littBeg":{"t":"A beginning for mathematics","u":"https://www.daniellitt.com/blog/2026/9/13/a-beginning-for-mathematics/","d":"2026-09-13"},"littBabel":{"t":"Mathematics in the Library of Babel","u":"https://www.daniellitt.com/blog/2026/2/20/mathematics-in-the-library-of-babel/","d":"2026-02-21"},"buzzard":{"t":"To grieve, or not to grieve?","u":"https://xenaproject.wordpress.com/2026/10/01/to-grieve-or-not-to-grieve/","d":"2026-10-01"},"cohn":{"t":"The technical debt of AI-generated mathematics","u":"https://terrytao.wordpress.com/2026/09/15/the-technical-debt-of-ai-generated-mathematics/","d":"2026-09-15"},"antieau":{"t":"Fast math/slow math","u":"https://terrytao.wordpress.com/2026/09/15/fast-math-slow-math/","d":"2026-09-15"},"riehl":{"t":"Why I do mathematical research","u":"https://terrytao.wordpress.com/2026/09/14/why-i-do-mathematic /* ================= ISOMETRIC PRIMITIVES ================= */
const TW=64, TH=32, OX=720, OY=250;
const P=(x,y,z=0)=>[OX+(x-y)*TW/2, OY+(x+y)*TH/2-z];
const pt=p=>`${f1(p[0])},${f1(p[1])}`;
const poly=(ps,cls)=>`<path class="${cls}" d="M${ps.map(pt).join("L")}Z"/>`;
const pline=(ps,cls="ln")=>`<path class="${cls}" d="M${ps.map(pt).join("L")}"/>`;
function box(x,y,w,d,h,z=0){
  const B0=P(x+w,y,z),C0=P(x+w,y+d,z),D0=P(x,y+d,z),A1=P(x,y,z+h),B1=P(x+w,y,z+h),C1=P(x+w,y+d,z+h),D1=P(x,y+d,z+h);
  return poly([D0,C0,C1,D1],"fl")+poly([B0,C0,C1,B1],"fr")+poly([A1,B1,C1,D1],"ft");
}
function winL(x,y,w,d,z0,h,cols,rows,cls="win"){ let s=""; const yy=y+d;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){ const u0=x+w*(i+.28)/cols,u1=x+w*(i+.72)/cols,v0=z0+h*(j+.28)/rows,v1=z0+h*(j+.72)/rows;
    s+=poly([P(u0,yy,v0),P(u1,yy,v0),P(u1,yy,v1),P(u0,yy,v1)],cls); } return s; }
function winR(x,y,w,d,z0,h,cols,rows,cls="win"){ let s=""; const xx=x+w;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){ const u0=y+d*(i+.28)/cols,u1=y+d*(i+.72)/cols,v0=z0+h*(j+.28)/rows,v1=z0+h*(j+.72)/rows;
    s+=poly([P(xx,u0,v0),P(xx,u1,v0),P(xx,u1,v1),P(xx,u0,v1)],cls); } return s; }
function gableX(x,y,w,d,h,rh){ const r0=P(x,y+d/2,h+rh), r1=P(x+w,y+d/2,h+rh);
  return poly([P(x,y,h),P(x+w,y,h),r1,r0],"ft")+poly([P(x,y+d,h),P(x+w,y+d,h),r1,r0],"fl")+poly([P(x+w,y,h),P(x+w,y+d,h),r1],"fr"); }
function gableY(x,y,w,d,h,rh){ const r0=P(x+w/2,y,h+rh), r1=P(x+w/2,y+d,h+rh);
  return poly([P(x,y,h),P(x,y+d,h),r1,r0],"ft")+poly([P(x+w,y,h),P(x+w,y+d,h),r1,r0],"fr")+poly([P(x,y+d,h),P(x+w,y+d,h),r1],"fl"); }
function pyramid(x,y,w,d,h,ph){ const ap=P(x+w/2,y+d/2,h+ph); return poly([P(x,y+d,h),P(x+w,y+d,h),ap],"fl")+poly([P(x+w,y,h),P(x+w,y+d,h),ap],"fr"); }
const E=(cx,cy,z,r)=>({c:P(cx,cy,z),rx:r*TW*.707,ry:r*TH*.707});
function cyl(cx,cy,r,h,z=0,top="ft"){ const b=E(cx,cy,z,r),t=E(cx,cy,z+h,r);
  return `<path class="fr" d="M${f1(t.c[0]-t.rx)},${f1(t.c[1])}L${f1(b.c[0]-b.rx)},${f1(b.c[1])}A${f1(b.rx)},${f1(b.ry)} 0 0 0 ${f1(b.c[0]+b.rx)},${f1(b.c[1])}L${f1(t.c[0]+t.rx)},${f1(t.c[1])}Z"/><ellipse class="${top}" cx="${f1(t.c[0])}" cy="${f1(t.c[1])}" rx="${f1(t.rx)}" ry="${f1(t.ry)}"/>`; }
function dome(cx,cy,r,z){ const t=E(cx,cy,z,r);
  return `<path class="ft" d="M${f1(t.c[0]-t.rx)},${f1(t.c[1])}A${f1(t.rx)},${f1(t.rx*.9)} 0 0 1 ${f1(t.c[0]+t.rx)},${f1(t.c[1])}A${f1(t.rx)},${f1(t.ry)} 0 0 1 ${f1(t.c[0]-t.rx)},${f1(t.c[1])}Z"/><path class="hz" d="M${f1(t.c[0]+t.rx*.25)},${f1(t.c[1]-t.rx*.82)}Q${f1(t.c[0]+t.rx*.8)},${f1(t.c[1]-t.rx*.5)} ${f1(t.c[0]+t.rx*.85)},${f1(t.c[1]-t.rx*.05)}"/>`; }
function cone(cx,cy,r,z,h){ const t=E(cx,cy,z,r), ap=P(cx,cy,z+h); return `<path class="fr" d="M${f1(t.c[0]-t.rx)},${f1(t.c[1])}A${f1(t.rx)},${f1(t.ry)} 0 0 0 ${f1(t.c[0]+t.rx)},${f1(t.c[1])}L${pt(ap)}Z"/>`; }
function flag(x,y,z,h){ const a=P(x,y,z),b=P(x,y,z+h); return pline([a,b])+`<path class="acf" d="M${pt(b)}l9,3l-9,3Z"/>`; }
function plot(x,y,w,ins,cls){ return poly([P(x+ins,y+ins),P(x+w-ins,y+ins),P(x+w-ins,y+w-ins),P(x+ins,y+w-ins)],cls); }
function treeRound(x,y,s=1){ const b=P(x,y,0),t=P(x,y,10*s); return pline([b,t])+`<circle class="ft" cx="${f1(t[0])}" cy="${f1(t[1]-5*s)}" r="${f1(6.5*s)}"/><path class="hz" d="M${f1(t[0]+1)},${f1(t[1]-9*s)}a5,5 0 0 1 3.5,6"/>`; }
function treePine(x,y,s=1){ const b=P(x,y,0); let d=`M${pt(b)}v${f1(-20*s)}`; for(let k=1;k<5;k++){ const yy=b[1]-20*s+k*4.2*s, w=1.5+k*1.8*s; d+=`M${f1(b[0])},${f1(yy-3*s)}L${f1(b[0]-w)},${f1(yy)}M${f1(b[0])},${f1(yy-3*s)}L${f1(b[0]+w)},${f1(yy)}`; } return `<path class="ln" d="${d}"/>`; }

const Lg=(x,y,inner,z=0,deg=0)=>isoG(x+.5,y+.5,z,deg,inner);
const at=(x,y,u,v,z=0)=>P(x+.5+u/G,y+.5+v/G,z);
function hexPrism(cx,cy,r,h,z){ const ps=[]; for(let k=0;k<6;k++){ const a=Math.PI/6+k*Math.PI/3; ps.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]); }
  let s=""; for(let k=0;k<6;k++){ const a=ps[k],b=ps[(k+1)%6], mx=(a[0]+b[0])/2-cx, my=(a[1]+b[1])/2-cy;
    if(mx+my>1e-4) s+=poly([P(a[0],a[1],z),P(b[0],b[1],z),P(b[0],b[1],z+h),P(a[0],a[1],z+h)],mx>my?"fr":"fl"); }
  return s+poly(ps.map(p=>P(p[0],p[1],z+h)),"ft"); }
function fig(p,s=1,extra=""){ return `<circle class="lnf" cx="${f1(p[0])}" cy="${f1(p[1]-13*s)}" r="${f1(2.2*s)}"/><path class="ln" d="M${f1(p[0])},${f1(p[1]-11*s)}v${f1(6*s)}l-2.5,${f1(5*s)}M${f1(p[0])},${f1(p[1]-5*s)}l2.5,${f1(5*s)}M${f1(p[0])},${f1(p[1]-9*s)}l-3.5,${f1(2.5*s)}M${f1(p[0])},${f1(p[1]-9*s)}l3.5,${f1(2*s)}${extra}"/>`; }
function mound(x,y,u,v,rw,rh,z=0){ const c=at(x,y,u,v,z); return `<path class="ft" d="M${f1(c[0]-rw)},${f1(c[1])}Q${f1(c[0])},${f1(c[1]-rh*2)} ${f1(c[0]+rw)},${f1(c[1])}Z"/><path class="hz" d="M${f1(c[0]+rw*.15)},${f1(c[1]-rh*.85)}q${f1(rw*.4)},${f1(rh*.3)} ${f1(rw*.6)},${f1(rh*.8)}"/>`; }
function board(n,size,dark=true){ const st=size/n; let s=`<rect class="lnf" x="${-size/2}" y="${-size/2}" width="${size}" height="${size}"/>`;
  if(dark){ for(let i=0;i<n;i++)for(let j=0;j<n;j++) if((i+j)%2) s+=`<rect class="sqd" x="${f1(-size/2+i*st)}" y="${f1(-size/2+j*st)}" width="${f1(st)}" height="${f1(st)}"/>`; }
  return s; }
function piece(x,y,u,v,h,z=0){ return cyl(x+.5+u/G,y+.5+v/G,.035,h,z)+(()=>{ const t=P(x+.5+u/G,y+.5+v/G,z+h+2); return `<circle class="lnf" cx="${f1(t[0])}" cy="${f1(t[1])}" r="2.4"/>`; })(); }
function stipple(cx,cy,r,n){ let d=""; for(let i=0;i<n;i++){ const a=rnd()*Math.PI*2, rr=Math.sqrt(rnd())*r, px=Math.cos(a)*rr, py=Math.sin(a)*rr; if(rnd()<.25+.7*Math.max(0,(px+py*.4)/r+.45)) d+=`M${f1(cx+px)},${f1(cy+py)}h.01`; } return `<path class="dots" d="${d}" style="stroke-width:1.3"/>`; }

    <div class="imgs">${b.imgs.map(r=>`<h4>${esc(r.t)}</h4><p>${esc(r.d)}</p>${r.k==="comment"?`<div class="tag">From the comments, by ${esc(r.a.replace(/^Readers? on /,"a reader on "))}</div>`:r.k==="tweet"?`<div class="tag">A tweet by ${esc(r.a)}</div>`:""}`).join("")}</div>
    ${others.length?`<h3>This text also built</h3><ul>${others.map(o=>`<li><button type="button" data-goto="${o.i}"><span class="dot"></span>${esc(CN[o.c])}</button></li>`).join("")}</ul>`:""}`);
  $("toD").onclick=()=>{ clearSel(); openDistrict(b.c,{fly:false}); };
  const w=svg.clientWidth,h=svg.clientHeight,k=Math.max(T.k,KHOME*2.2),c=center(b), cx=w>720?(w-380)/2:w/2, cy=w>720?h/2+40:h*.3;
  flyTo({k,x:cx-c[0]*k,y:cy-c[1]*k});
}
const tip=$("tip");
svg.addEventListener("pointerover",e=>{ const g=e.target.closest(".bld"); if(!g||pts.size) return; const b=DATA.buildings[+g.dataset.b];
  tip.innerHTML=`<b>${esc(b.src.t)}</b><span>${esc(short(b.imgs[0].a))} · ${esc(CN[b.c])}</span>`; tip.style.display="block"; if(sel===null) kin(b); });
svg.addEventListener("pointermove",e=>{ if(tip.style.display!=="block") return;
  const tw=tip.offsetWidth, th=tip.offsetHeight, tag=document.querySelector(".dtag.show");
  const cands=[[e.clientX+14,e.clientY+16],[e.clientX-14-tw,e.clientY+16],[e.clientX+14,e.clientY-16-th],[e.clientX-14-tw,e.clientY-16-th]];
  let pick=cands[0];
  if(tag){ const r=tag.getBoundingClientRect(); const hit=([x,y])=>x<r.right+4&&x+tw>r.left-4&&y<r.bottom+4&&y+th>r.top-4;
    pick=cands.find(c=>!hit(c)&&c[0]>4&&c[0]+tw<innerWidth-4&&c[1]>4)||cands[0]; }
  tip.style.left=Math.max(4,Math.min(pick[0],innerWidth-tw-4))+"px"; tip.style.top=Math.max(4,pick[1])+"px"; });
svg.addEventListener("pointerout",e=>{ const g=e.target.closest(".bld"); if(!g) return; if(e.relatedTarget&&g.contains(e.relatedTarget)) return; tip.style.display="none"; if(sel===null) kin(null); else kin(DATA.buildings[sel]); });
svg.addEventListener("click",e=>{
  if(moved>4) return; tip.style.display="none";
  const g=e.target.closest(".bld"); if(g){ openBuilding(+g.dataset.b); return; }
  const d=e.target.closest("[data-d]"); if(d&&d.dataset.d){ if(focus!==d.dataset.d||sel!==null) openDistrict(d.dataset.d); return; }
  if(focus) overview();
});
svg.addEventListener("keydown",e=>{ if(e.key!=="Enter"&&e.key!==" ") return; const g=e.target.closest&&e.target.closest(".bld"); if(g){ e.preventDefault(); openBuilding(+g.dataset.b); } });
$("panel").addEventListener("click",e=>{ const b=e.target.closest("[data-goto]"); if(b){ openBuilding(+b.dataset.goto); return; } const d=e.target.closest("[data-district]"); if(d) openDistrict(d.dataset.district); });
$("panel").addEventListener("mouseover",e=>{ const d=e.target.closest("[data-district]"); if(d){ document.querySelectorAll(`[data-d="${d.dataset.district}"]`).forEach(el=>el.classList.remove("out")); hoverD=d.dataset.district; showTags(); } });
$("panel").addEventListener("mouseout",e=>{ const d=e.target.closest("[data-district]"); if(d){ hoverD=null; if(focus) setFocus(focus); else showTags(); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") back(); });


let hoverD=null;
function showTags(){ DL.forEach(l=>{ const on=l.el.dataset.d===hoverD||l.el.dataset.d===focus; [l.el,l.ln,l.dot].forEach(e=>e.classList.toggle("show",on)); }); placeTags(); }
svg.addEventListener("pointerover",e=>{ const d=e.target.closest("[data-d]"); const id=d&&d.dataset.d?d.dataset.d:null; if(id!==hoverD){ hoverD=id; showTags(); } });
svg.addEventListener("pointerleave",()=>{ hoverD=null; showTags(); });

/* ================= SEARCH ================= */
function search(){
  const q=$("q").value.trim().toLowerCase(); let hits=[];
  DATA.buildings.forEach(b=>{ const hit=!q||b.imgs.some(r=>[r.t,r.d,r.a,r.k].join(" ").toLowerCase().includes(q))||b.src.t.toLowerCase().includes(q)||CN[b.c].toLowerCase().includes(q);
    b.el.classList.toggle("dim",!!q&&!hit); if(q&&hit) hits.push(b); });
  document.querySelectorAll(".deco").forEach(d=>d.classList.toggle("dim",!!q));
  const ni=hits.reduce((s,b)=>s+b.n,0);
  $("status").textContent=q?(hits.length?`${hits.length} matching building${hits.length>1?"s":""}. Enter to frame them.`:"Nothing matches. Try a shorter word."):"";
  if(q&&focus){ clearSel(); setFocus(null); closePanel(); }
  return hits;
}
$("q").addEventListener("input",search);
$("q").addEventListener("keydown",e=>{ if(e.key!=="Enter") return; const h=search(); if(!h.length) return; if(h.length===1){ openBuilding(h[0].i); return; }
  const cs=h.map(center), xs=cs.map(c=>c[0]), ys=cs.map(c=>c[1]); flyTo(fitBox(Math.min(...xs)-60,Math.min(...ys)-70,Math.max(...xs)+60,Math.max(...ys)+40)); });

/* ================= STYLE SWITCH ================= */
const STYLES=[
 {id:"night",name:"Night engraving",traits:"hatch serif dark",a:"#060607",b:"#ECEBE4"},
 {id:"quanta",name:"Quanta",traits:"noglow skygrad",a:"#5D52D9",b:"#EF6656"},
 {id:"blueprint",name:"Blueprint",traits:"hatch mono dark noglow",a:"#1C4A82",b:"#FFD54A"},
 {id:"atlas",name:"Old atlas",traits:"hatch serif",a:"#EEE4CD",b:"#A8322D"},
 {id:"riso",name:"Risograph",traits:"noglow",a:"#2B3BAE",b:"#FF4A86"},
 {id:"neon",name:"Neon",traits:"dark skygrad",a:"#0C0220",b:"#33E6EA"}
];
$("stylemenu").innerHTML=STYLES.map(s=>`<button type="button" class="sopt" role="menuitemradio" aria-checked="false" data-style="${s.id}"><span class="swd" style="--a:${s.a};--b:${s.b}"></span>${s.name}</button>`).join("");
function styleMenu(open){ const m=$("stylemenu"), b=$("stylebtn"); m.hidden=!open; b.setAttribute("aria-expanded",open); if(open){ const cur=m.querySelector('[aria-checked="true"]')||m.querySelector(".sopt"); cur.focus(); } }
$("stylebtn").onclick=e=>{ e.stopPropagation(); if(!$("searchpop").hidden) searchPop(false); styleMenu($("stylemenu").hidden); };
document.addEventListener("click",e=>{ if(!$("stylemenu").hidden&&!e.target.closest("#stylemenu,#stylebtn")) styleMenu(false); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("stylemenu").hidden){ e.stopImmediatePropagation(); styleMenu(false); $("stylebtn").focus(); } },true);
$("stylemenu").addEventListener("keydown",e=>{ if(e.key!=="ArrowDown"&&e.key!=="ArrowUp") return; e.preventDefault(); const it=[...document.querySelectorAll(".sopt")], i=it.indexOf(document.activeElement); it[(i+(e.key==="ArrowDown"?1:it.length-1))%it.length].focus(); });

function searchPop(open){ const m=$("searchpop"); m.hidden=!open; $("searchbtn").setAttribute("aria-expanded",open); if(open){ styleMenu(false); $("q").focus(); } }
$("searchbtn").onclick=e=>{ e.stopPropagation(); searchPop($("searchpop").hidden); };
document.addEventListener("click",e=>{ if(!$("searchpop").hidden&&!e.target.closest("#searchpop,#searchbtn")) searchPop(false); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("searchpop").hidden){ e.stopImmediatePropagation(); searchPop(false); $("searchbtn").focus(); } },true);
$("q").addEventListener("input",()=>$("searchbtn").classList.toggle("active",!!$("q").value.trim()));

function toolsOpen(open){ $("tools").hidden=!open; $("toolsbtn").setAttribute("aria-expanded",open); $("toolsbtn").setAttribute("aria-label",open?"Hide controls":"Show controls");
  if(!open){ styleMenu(false); searchPop(false); } syncDot(); }
function syncDot(){ $("toolsbtn").classList.toggle("active",$("tools").hidden&&!!$("q").value.trim()); }
$("toolsbtn").onclick=e=>{ e.stopPropagation(); toolsOpen($("tools").hidden); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("tools").hidden&&$("searchpop").hidden&&$("stylemenu").hidden&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".zoom")){ e.stopImmediatePropagation(); toolsOpen(false); $("toolsbtn").focus(); } },true);
$("q").addEventListener("input",syncDot);
function setStyle(id){
  const s=STYLES.find(x=>x.id===id)||STYLES[0];
  document.body.className=s.id+" "+s.traits;
  document.querySelectorAll(".sopt").forEach(b=>b.setAttribute("aria-checked",b.dataset.style===s.id));
  $("stylebtn").style.setProperty("--a",s.a); $("stylebtn").style.setProperty("--b",s.b); dlDirty=true; apply();
  try{ localStorage.setItem("city-style",s.id); }catch(e){}
}
document.querySelectorAll(".sopt").forEach(b=>b.onclick=()=>{ setStyle(b.dataset.style); styleMenu(false); $("stylebtn").focus(); });
T=homeBox(); KHOME=T.k;
let saved=null; try{ saved=localStorage.getItem("city-style"); }catch(e){} setStyle(saved||"night");
apply(); search();
let rt; addEventListener("resize",()=>{clearTimeout(rt); rt=setTimeout(()=>{ KHOME=homeBox().k; if(!focus){T=homeBox();apply();} },150);});
},0));
</script>
