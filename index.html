  --bg:#060607; --line:#ECEBE4; --line-soft:rgba(236,235,228,.6); --line-faint:rgba(236,235,228,.2);
  --fill1:#0A0A0C; --land:#0A0A0C; --acc:#F2A23C; --acc2:#45D6C6; --glow:#FFF1CC;

}

roudly planted flags on rocks explorers were already close to summiting, which upset the explorers.","a":"Christian Szegedy","s":"szegedy","k":"essay"},{"c":"terrain","t":"Satellites and mining","d":"Cheap planes bring satellites that map the whole terrain for deposits; extraction will be messy and corporate.","a":"Christian Szegedy","s":"szegedy","k":"essay"},{"c":"terrain","t":"Mansion with no floor plans","d":"Teams wander dark corridors forcing stuck doors; once one opens, someone reinforces the ceiling, turns on a light, and relays word to whoever draws the map.","a":"Emily Riehl","s":"riehl","k":"essay"},{"c":"terrain","t":"Library of Babel","d":"A library holding proofs of every ZFC theorem plus guides; a mathematician inside would still get to work, because the goal is understanding.","a":"Daniel Litt","s":"littBabel","k":"essay"},{"c":"terrain","t":"Clinging to a giant edifice","d":"Research as feeling out a huge structure, bashing your skull into an object until its texture imprints on your forehead.","a":"Daniel Litt","s":"littBabel","k":"essay"},{"c":"terrain","t":"Natural boundary","d":"Machines will stop at some boundary where the next leap is not worth the resources; humans then journey to where they stopped.","a":"Kevin Buzzard","s":"buzzard","k":"essay"},{"c":"terrain","t":"Lighthouses in the night","d":"An open question is a lighthouse guiding mathematicians' wanderings; don't use our most beautiful conjectures as mere benchmarks.","a":"Hugo Duminil-Copin","s":"duminil","k":"essay"},{"c":"terrain","t":"Oceans between lemma and breakthrough","d":"An ocean separates a technical lemma from a serious paper, another from a breakthrough, and several more from Fields-level work.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"terrain","t":"Surveying new continents","d":"AI may let young \u201cintuition-maxxers\u201d survey entire new continents at a pace that mystifies their elders.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"terrain","t":"A narrow ridge","d":"Between a bright AI-assisted future and churning out pointless papers ever faster lies a narrow ridge.","a":"Pierre Marion","s":"marion","k":"essay"},{"c":"terrain","t":"Helicopter to the summit, or to Narnia","d":"Using AI on old problems is a helicopter to a familiar summit; real discovery would be a helicopter into a strange, fertile Narnia.","a":"Reader on Sahai's post","s":"sahai","k":"comment"},{"c":"terrain","t":"The Alaskan hike","d":"Let AI book the flight for your backpacking trip, not take the hike for you and send pictures.","a":"Jeremy Avigad","s":"avigad","k":"essay"},{"c":"speed","t":"Wright brothers' airplane","d":"AI in mathematics is at the twelve-second-flight stage: primitive, expensive, improving fast. Don't bet against the airplane.","a":"Christian Szegedy","s":"szegedy","k":"essay"},{"c":"speed","t":"Object approaching light speed","d":"Not an airplane we fly but something accelerating away from us, receding from sight as it nears light speed.","a":"Justin Asher","s":"asher","k":"essay"},{"c":"speed","t":"Faster than you can steer","d":"Driving faster than you can run is fine, not faster than you can steer; AI multiplies the \u201ccontrol points\u201d that need skilled humans.","a":"Po-Shen Loh","s":"loh","k":"essay"},{"c":"speed","t":"Airline pilots","d":"Learn from professions like airline pilots that faced automation-driven skill erosion; LLMs as a superpower PhD students must learn to pilot.","a":"Pierre Marion","s":"marion","k":"essay"},{"c":"speed","t":"Ferrari at the marathon","d":"Using AI is like showing up to a marathon in a Ferrari, or with steroids; cars got their own sport, Formula 1.","a":"Reader on Antieau's post","s":"antieau","k":"comment"},{"c":"speed","t":"Self-driving levels","d":"Autoformalization is no more a full solution than Tesla's Full Self-Driving; proposes a Mathematical Intelligence Scale like self-driving levels.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"build","t":"Builder and explorer","d":"Grothendieck's builder of new houses versus Szegedy's explorer; soon AI does both, and we feel like children again.","a":"Justin Asher","s":"asher","k":"essay"},{"c":"build","t":"Foundations under stress test","d":"Like the 1900\u20131930 crisis in foundations, but now the implicit framework of values and practices is being stress-tested.","a":"Terence Tao","s":"tao","k":"essay"},{"c":"build","t":"Monorepo and canonization","d":"Mathlib as a coherent monorepo that autoformalization depends on; canonization turns one-off formalizations into library mathematics.","a":"Alex Kontorovich","s":"kontorovich","k":"essay"},{"c":"build","t":"Mathlib versus Mathslop","d":"Formal math splits into an intelligible layer and an unintelligible one; an autoformalized proof sits as an orphaned 200,000-line blob.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"economy","t":"The theorem economy","d":"Theorems are the only currency that puts bread on the table; research mathematicians risk being demonetized.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"economy","t":"The Overhang","d":"The latent value of connecting existing results, like unrealized capital gains of past creativity, which LLMs are placed to harvest.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"economy","t":"Honor code and Hardy's curse","d":"Prove theorems and shut up; \u201cthe first rule of the Intuition Club\u201d; a big conjecture as cryptographic proof of conceptual innovation.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"economy","t":"Product recall","d":"Mathematics sold a bogus idea of itself to billions; repositioning the brand may be the largest product recall in memory.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"economy","t":"Technical debt","d":"Math slop creates technical debt that someone else must pay, worse than in software because the answer alone is rarely the point.","a":"Henry Cohn","s":"cohn","k":"essay"},{"c":"economy","t":"Proof scarcity and abundance","d":"Institutions built for scarce proofs will misbehave in an era of proof abundance.","a":"Terence Tao","s":"tao","k":"essay"},{"c":"economy","t":"Slot machine for conjectures","d":"Outputs are now mispriced; the dominant career strategy becomes pulling the slot-machine lever on conjectures.","a":"Daniel Litt","s":"littEnd","k":"essay"},{"c":"economy","t":"The price of a nice dinner","d":"Some basic questions can now be resolved for the marginal cost of a nice dinner, and we should be delighted.","a":"Daniel Litt","s":"littBeg","k":"essay"},{"c":"economy","t":"Mathematics as commodity","d":"Mathematics becomes a commodity produced on demand.","a":"Justin Asher","s":"asher","k":"essay"},{"c":"economy","t":"Collapse of the h-index","d":"Producing papers becomes a commodity, so their value for hiring and evaluation collapses.","a":"Pierre Marion","s":"marion","k":"essay"},{"c":"body","t":"Proof indigestion","d":"Impedance mismatches, or less flatteringly proof indigestion, all along the pipeline from generation to canonicalization.","a":"Terence Tao","s":"tao","k":"essay"},{"c":"body","t":"Friction sanded away","d":"Over-polished AI proofs sand away the natural friction that tells a reader where to slow down.","a":"Terence Tao","s":"tao","k":"essay"},{"c":"body","t":"Atrophying organs","d":"Organs of the community like MathOverflow are atrophying, cannibalized by Discord and then AI.","a":"Daniel Litt","s":"littEnd","k":"essay"},{"c":"religion","t":"Priest, then monk","d":"Mathematicians become priests interpreting revelation from on high, then monks meditating on truths beyond their horizon.","a":"Logan Graves","s":"graves","k":"essay"},{"c":"religion","t":"Silicon Leviathan and its Siren call","d":"AI labs as a Hobbesian Leviathan; accepting a certificate without demonstration is the bargain where authority, not truth, makes the law.","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"religion","t":"Clergy, laity, and Lean as Latin","d":"Truths held on authority again: the prover's owners are the clergy, and the language the laity cannot read is Lean.","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"religion","t":"Certificate of an unvisited monument","d":"A 616,000-line Lean proof is a reliable document about a monument no one has visited.","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"religion","t":"Enlightenment twilight","d":"The Enlightenment bound itself to the mast of mathematics; the ship entering turbulent waters threatens the whole project (Aufkl\u00e4rungsd\u00e4mmerung).","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"religion","t":"Subhuman superintelligence","d":"Less than human in humanitas, more than human in speed; its builders cast as alchemists.","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"religion","t":"Revealed truth","d":"An unreadable AI Lean proof as a \u201crevealed\u201d truth, unquestionable and undemocratic (comment summarizing Gamburd).","a":"Reader on Buzzard's post","s":"buzzard","k":"comment"},{"c":"war","t":"Commons and enclosure","d":"Open literature is a commons and frontier models its enclosure; guarding work leads to a \u201cMiddle Ages in reverse.\u201d","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"war","t":"Bloodless sword","d":"Withholding acceptance is the community's only weapon, the one sword the Leviathans cannot forge for themselves.","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"war","t":"Weil's three monsters","d":"Money, mechanisation and algebra fused into one body.","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"war","t":"Rhetoric of colonial progress","d":"Inevitability talk about an AI takeover of math echoes 19th-century colonial rhetoric of progress.","a":"Michael Harris","s":"harris","k":"essay"},{"c":"war","t":"Occupation and collaborators","d":"Advisors helping a company eat us slower; Cassandra's fate; pulling up the ladder to rule a land with no children.","a":"Vladimir Lazi\u0107","s":"lazic","k":"essay"},{"c":"war","t":"The Diggers' song","d":"A 17th-century commons movement's song rewritten as \u201cYou noble eggheads all\u201d against tech barons.","a":"Anonymous postdoc","s":"diggers","k":"essay"},{"c":"war","t":"Cossacks at the gates","d":"Under agentic swarms we are all second-rate minds; we can do little about the Cossacks at the gates (Fiddler on the Roof).","a":"Ethan Sussman","s":"sussman","k":"essay"},{"c":"war","t":"Bulldozers, battering rams, nukes","d":"Conjectures fall to bulldozers and battering rams; AI discoveries decapitate fields and nuke the landscape.","a":"Hugo Duminil-Copin","s":"duminil","k":"essay"},{"c":"war","t":"Radioactive wasteland","d":"AI companies will bomb formalization into a wasteland that can never sustain life again (Patrick Massot, quoted).","a":"David Bessis","s":"bessis","k":"essay"},{"c":"war","t":"Caliper to a gunfight","d":"Also: a fox thanking the hens for the henhouse keys, collective seppuku, a \u201cnuclear scenario\u201d for the Riemann hypothesis.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"war","t":"Manhattan Project","d":"Co-authoring with AI labs is the Manhattan Project of our time; playing with fire; the sandbox is a cage.","a":"Max Weinreich","s":"weinreich","k":"essay"},{"c":"war","t":"Die on that hill","d":"Scholze will not use AI and will die on that hill (quoted).","a":"Kevin Buzzard","s":"buzzard","k":"essay"},{"c":"grief","t":"Five stages of grief","d":"Denial, anger, bargaining and depression all well represented in the community.","a":"Kevin Buzzard","s":"buzzard","k":"essay"},{"c":"grief","t":"Graduation","d":"Mathematics is about to graduate; the emptiness after the last competition.","a":"Christian Szegedy","s":"szegedy","k":"essay"},{"c":"grief","t":"Pandemic that kills mathematicians","d":"The literature survives but nobody can read it; with AI, most of math could become like forgotten areas nobody reads.","a":"Timothy Gowers","s":"gowersLeiden","k":"essay"},{"c":"grief","t":"Rug pulled out; ship sailed","d":"Seeing an AI one-shot a beloved problem felt like the rug pulled from under his feet; for classical automated proving, that ship has sailed.","a":"Timothy Gowers","s":"gowersLeiden","k":"essay"},{"c":"grief","t":"Stars without astronomers' names","d":"Theorems detached from mathematicians might be no worse than stars not named after astronomers.","a":"Timothy Gowers","s":"gowersLeiden","k":"essay"},{"c":"grief","t":"Requiem for a field","d":"Tsimerman's Fields Medal profile reads like a requiem (quoting Kevin Hartnett).","a":"Peter Woit","s":"woit","k":"essay"},{"c":"games","t":"Go, chess and Move 37","d":"Kasparov's and Lee Sedol's confident dismissals; the board for mathematics is infinite.","a":"Justin Asher","s":"asher","k":"essay"},{"c":"games","t":"A closed system like Go","d":"Hinton calls math a closed system like Go and chess; if AI \u201cwins,\u201d the only loser left is human thought.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"games","t":"Wimbledon versus the U.S. Open","d":"Tradition, white clothes and etiquette versus a louder, more democratic, more open future.","a":"Steven Strogatz","s":"strogatz","k":"essay"},{"c":"games","t":"Sudoku on a changing board","d":"Not ever more sudokus: the board changes shape and dimension; the team just got a superstar new player.","a":"Kevin Buzzard","s":"buzzard","k":"essay"},{"c":"games","t":"Chess where everyone has an engine","d":"Not like chess after Deep Blue, but chess where everyone secretly uses a program.","a":"Peter Woit","s":"woit","k":"essay"},{"c":"games","t":"Novice relaying grandmasters' moves","d":"AI-written, AI-digested math reduces humans to the messenger who relays moves between two grandmasters.","a":"Max Weinreich","s":"weinreich","k":"essay"},{"c":"games","t":"Endgame tablebases","d":"Chess ignored superhuman tablebase mates via the 50-move rule; math could ignore results humans can't verify.","a":"Reader on Sahai's post","s":"sahai","k":"comment"},{"c":"games","t":"Search tree and a nose","d":"LLMs explore many low-probability branches and get lucky; humans may keep an edge where the search tree needs pruning by nose.","a":"Timothy Gowers","s":"gowersLLM","k":"essay"},{"c":"games","t":"AlphaZero test, Stockfish","d":"Sarnak's AlphaZero test; the Navier\u2013Stokes run was Stockfish, not AlphaZero.","a":"Alexander Gamburd","s":"gamburd","k":"essay"},{"c":"games","t":"Olympics and Formula 1","d":"If robots outrun humans, do we cancel the Olympics? F1 already exists alongside them.","a":"Readers on Loh's post","s":"loh","k":"comment"},{"c":"food","t":"Fast food, slow food","d":"Fast math and slow math as two modalities, borrowed from the slow food movement.","a":"Ben Antieau","s":"antieau","k":"essay"},{"c":"food","t":"Blenders and the gym","d":"Robots outlift us yet we go to the gym; blenders outchew us yet we don't eat through straws.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"food","t":"IKEA versus artisanal theorems","d":"Affordable consistent output versus handmade furniture; perhaps an appetite for artisanal theorems.","a":"Reader on Gowers's post","s":"gowersLeiden","k":"comment"},{"c":"food","t":"Tailor and sewing machine","d":"Refusing AI like a tailor refusing a sewing machine; rebutted with Japanese artisan jeans.","a":"Readers on Lazi\u0107's post","s":"lazic","k":"comment"},{"c":"food","t":"AI vegetarian, AI vegan","d":"Natural versus artificial mathematics, as dietary identities; proofs that \u201cgrow on trees.\u201d","a":"Max Weinreich","s":"weinreich","k":"essay"},{"c":"machines","t":"Doesn't compile in the brain","d":"Unintelligible proofs are meaningless because they don't compile on the only hardware that can appreciate them.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"machines","t":"Samplers and sequencers","d":"AI may do for math what samplers did for music; standing on the shoulders of giant machines.","a":"David Bessis","s":"bessis","k":"essay"},{"c":"machines","t":"Monkey enumerating ZFC","d":"A computer or monkey applying deduction rules from the axioms shows proving theorems is not the goal.","a":"Daniel Litt","s":"littBeg","k":"essay"},{"c":"machines","t":"Lab science with agents","d":"Human mathematicians directing compute, doing lab science with agents.","a":"Daniel Litt","s":"littEnd","k":"essay"},{"c":"machines","t":"A proof with a hole is a poof","d":"Also HAL 9000 and WALL-E's AUTO, and a backlash like Three Mile Island or Chernobyl.","a":"Po-Shen Loh","s":"loh","k":"essay"},{"c":"machines","t":"A baby controlling its mother","d":"Hinton's only example of a less intelligent thing controlling a more intelligent one (quoted).","a":"Po-Shen Loh","s":"loh","k":"essay"},{"c":"machines","t":"Colleague down the hall","d":"AI fills the missing colleague at a small college; stronger, and perhaps stranger, tools.","a":"Jennifer Taback","s":"taback","k":"essay"},{"c":"machines","t":"Lean as source of truth","d":"Decrypting Lean into English; \u201ctheoremmaxxing\u201d; a smart kid who's an expert in the field.","a":"Kevin Buzzard","s":"buzzard","k":"essay"},{"c":"machines","t":"Low-hanging fruit","d":"AI results so far are low-hanging fruit needing no extensive new theory.","a":"Bruce Schneier and Kasra Rafi","s":"schneier","k":"essay"},{"c":"machines","t":"Assembly versus source code","d":"Mathematicians make proofs readable as source code is to assembly; AI is Hilbert's program, humans G\u00f6del's theorem.","a":"Readers on Loh's post","s":"loh","k":"comment"},{"c":"machines","t":"Telescopes and colliders","d":"AI as scientific instrument: correspondence telescopes, counterexample colliders, the denominator fallacy.","a":"Reader on Gowers's post","s":"gowersLeiden","k":"comment"},{"c":"cosmos","t":"Pascal's sphere","d":"Mathematics as an infinite sphere; beyond human understanding, inscrutable trophies of alien intelligence; LLMs doing math for a nascent civilization.","a":"Ben Antieau","s":"antieau","k":"essay"},{"c":"cosmos","t":"Infinity beats exponential","d":"Mathematics is infinite, which beats exponential growth hands down.","a":"Kevin Buzzard","s":"buzzard","k":"essay"},{"c":"cosmos","t":"Deployable intellectual reserve","d":"Mathematicians as a reserve humanity can call on, e.g. to vet an AI-designed terawatt fusion plant.","a":"Amit Sahai","s":"sahai","k":"essay"},{"c":"cosmos","t":"Exams set by aliens","d":"Bleaker if math were problems imposed by aliens; past \u201calien\u201d technologies; Twain's exaggerated death.","a":"Jeremy Avigad","s":"avigad","k":"essay"},{"c":"cosmos","t":"Conjecture falling in the woods","d":"If a conjecture falls in the woods and no one hears it, who cares?","a":"Daniel Litt","s":"littBeg","k":"essay"}],"S":{"szegedy":{"t":"Is Mathematics Over, or Just Graduating?","u":"https://docs.google.com/document/d/e/2PACX-1vTSh-pyNP3Gi99WMmsinnLmE9V5CDI0HEm6WGbIPMNt3V5SGlClHF8-BetotKHOImrvQDSXmFdiOw8D/pub","d":"2026-10-03"},"asher":{"t":"Math, accelerating toward light speed","u":"https://justinasher.me/math-approaching-light-speed","d":"2026-10-05"},"tao":{"t":"Mathematics in the age of AI (arXiv 2608.16753)","u":"https://arxiv.org/abs/2608.16753","d":"2026-08-17"},"marion":{"t":"The Future of Research in the Age of AI","u":"https://pierremarion23.github.io/thoughts/2026-10-01.html","d":"2026-10-01"},"littEnd":{"t":"The End of Mathematics","u":"https://www.daniellitt.com/blog/2026/8/11/the-end-of-mathematics/","d":"2026-08-11"},"littBeg":{"t":"A beginning for mathematics","u":"https://www.daniellitt.com/blog/2026/9/13/a-beginning-for-mathematics/","d":"2026-09-13"},"littBabel":{"t":"Mathematics in the Library of Babel","u":"https://www.daniellitt.com/blog/2026/2/20/mathematics-in-the-library-of-babel/","d":"2026-02-21"},"buzzard":{"t":"To grieve, or not to grieve?","u":"https://xenaproject.wordpress.com/2026/10/01/to-grieve-or-not-to-grieve/","d":"2026-10-01"},"cohn":{"t":"The technical debt of AI-generated mathematics","u":"https://terrytao.wordpress.com/2026/09/15/the-technical-debt-of-ai-generated-mathematics/","d":"2026-09-15"},"antieau":{"t":"Fast math/slow math","u":"https://terrytao.wordpress.com/2026/09/15/fast-math-slow-math/","d":"2026-09-15"},"riehl":{"t":"Why I do mathematical research","u":"https://terrytao.wordpress.com/2026/09/14/why-i-do-mathematical-research/","d":"2026-09-14"},"sahai":{"t":"We\u2019re gonna need a lot more mathematicians","u":"https://terrytao.wordpress.com/2026/09/24/were-gonna-need-a-lot-more-mathematicians/","d":"2026-09-24"},"gowersLLM":{"t":"What sort of maths are LLMs good at?","u":"https://gowers.wordpress.com/2026/08/12/what-sort-of-maths-are-llms-good-at/","d":"2026-08-12"},"gowersLeiden":{"t":"Thoughts about the Leiden Declaration","u":"https://gowers.wordpress.com/2026/07/26/thoughts-about-the-leiden-declaration/","d":"2026-07-26"},"bessis":{"t":"The fall of the theorem economy","u":"https://davidbessis.substack.com/p/the-fall-of-the-theorem-economy","d":"2026-04-21"},"graves":{"t":"Priest, Monk, and Mathematician","u":"https://logangraves.com/priest-monk-mathematician","d":"2026-09-10"},"lazic":{"t":"Rulers of the childless land: A response to the AGMAI","u":"https://proofsandprompts.com/2026/09/24/rulers-of-the-childless-land-a-response-to-the-agmai/","d":"2026-09-24"},"strogatz":{"t":"Wimbledon, the U.S. Open, and the future of mathematics","u":"https://terrytao.wordpress.com/2026/09/12/wimbledon-the-u-s-open-and-the-future-of-mathematics/","d":"2026-09-12"},"sussman":{"t":"Only Anatevka","u":"https://proofsandprompts.com/2026/10/02/only-anatevka/","d":"2026-10-02"},"diggers":{"t":"The diggers","u":"https://proofsandprompts.com/2026/10/04/the-diggers/","d":"2026-10-04"},"duminil":{"t":"Care for a little more AI?","u":"https://proofsandprompts.com/2026/08/30/care-for-a-little-more-ai/","d":"2026-08-30"},"avigad":{"t":"The Future of Mathematics","u":"https://terrytao.wordpress.com/2026/10/05/the-future-of-mathematics/","d":"2026-10-05"},"taback":{"t":"What does the advent of powerful AI models mean for mathematicians like me?","u":"https://terrytao.wordpress.com/2026/10/03/what-does-the-advent-of-powerful-ai-models-mean-for-mathematicians-like-me/","d":"2026-10-03"},"woit":{"t":"Requiem for a Field?","u":"https://www.math.columbia.edu/~woit/wordpress/?p=15787","d":"2026-07-26"},"weinreich":{"t":"The crisis of AI-generated mathematics (arXiv 2608.02859)","u":"https://arxiv.org/abs/2608.02859","d":"2026-08-03"},"gamburd":{"t":"The Siren Call of Silicon Leviathan (arXiv 2609.28591)","u":"https://arxiv.org/abs/2609.28591","d":"2026-09-23"},"harris":{"t":"The essay on the Navier-Stokes story that everyone should read","u":"https://siliconreckoner.substack.com/p/the-essay-on-the-navier-stokes-story","d":"2026-09-30"},"loh":{"t":"Why Do We Need Human Mathematicians Anymore?","u":"https://terrytao.wordpress.com/2026/09/19/why-do-we-need-human-mathematicians-anymore/","d":"2026-09-19"},"kontorovich":{"t":"Interactions of AI with research math and formalization","u":"https://alexkontorovich.wordpress.com/2026/04/05/lecture-interactions-of-ai-with-research-math-and-formalization-at-newton-insitute-cambridge/","d":"2026-04-05"},"schneier":{"t":"AI Doesn\u2019t Mean the End of Mathematics\u2014at Least Not Yet","u":"https://www.schneier.com/blog/archives/2026/08/ai-doesnt-mean-the-end-of-mathematics-at-least-not-yet.html","d":"2026-08-25"}},"ICONS":{"terrain":"<path d=\"M3 20h18L14.5 8l-3.5 6-2.5-3.5L3 20z\"/><path d=\"M14.5 8l1.6 2.8\"/>","speed":"<path d=\"M2.5 13.5l7-1.5 5-6.5c.8-1 2.6-1.5 3.3-.8.7.7.2 2.5-.8 3.3l-6.5 5-1.5 7-2-1-.5-5-5-.5z\"/>","build":"<path d=\"M3 21h18M4 9h16M12 3l8 6H4l8-6zM6 9v9M10 9v9M14 9v9M18 9v9M4 18h16\"/>","economy":"<ellipse cx=\"12\" cy=\"7\" rx=\"7\" ry=\"3\"/><path d=\"M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5\"/>","body":"<path d=\"M12 20s-7.5-4.5-7.5-10A4.3 4.3 0 0 1 12 7.5 4.3 4.3 0 0 1 19.5 10C19.5 15.5 12 20 12 20z\"/>","religion":"<path d=\"M9 21h6M10 21V11h4v10M12 11V8\"/><path d=\"M12 8c-1.2-1.3-1.2-3 0-5 1.2 2 1.2 3.7 0 5z\"/>","war":"<path d=\"M14.5 3.5H20.5V9.5L9 21 3 15z\"/><path d=\"M6 18l-2.5 2.5M13 11l3-3\"/>","grief":"<path d=\"M6 21V10a6 6 0 0 1 12 0v11M4 21h16M12 9v6M9.5 11.5h5\"/>","games":"<circle cx=\"12\" cy=\"6\" r=\"2.5\"/><path d=\"M9.5 21h5l-1-7.5h-3zM8 21h8M9 12h6\"/>","food":"<path d=\"M7 3v8a2 2 0 0 0 2 2v8M5 3v6M9 3v6M17 21V3c-2 1.5-3 4-3 7v3h3\"/>","machines":"<rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"1.5\"/><rect x=\"9.5\" y=\"9.5\" width=\"5\" height=\"5\"/><path d=\"M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3\"/>","cosmos":"<circle cx=\"12\" cy=\"12\" r=\"4.5\"/><path d=\"M4.2 15.5c-1.8 1.8-2.2 3.3-1.4 3.9 1.6 1.2 7.3-1.7 12.6-6.9s7.7-10.3 6.1-11.2c-.8-.5-2.4.2-4.2 1.7\"/>"},"clusters":[{"id":"terrain","name":"Terrain and exploration"},{"id":"speed","name":"Vehicles and speed"},{"id":"build","name":"Buildings and libraries"},{"id":"economy","name":"Economy and debt"},{"id":"body","name":"Digestion and the body"},{"id":"religion","name":"Religion and revelation"},{"id":"war","name":"Empire, war and resistance"},{"id":"grief","name":"Grief, death and ruin"},{"id":"games","name":"Games and sport"},{"id":"food","name":"Food and craft"},{"id":"machines","name":"Software and machines"},{"id":"cosmos","name":"Cosmos and civilization"}]};

/* ================= ISOMETRIC PRIMITIVES ================= */
const TW=64, TH=32, OX=720, OY=250;
const P=(x,y,z=0)=>[OX+(x-y)*TW/2, OY+(x+y)*TH/2-z];
const pt=p=>`${f1(p[0])},${f1(p[1])}`;
const poly=(ps,cls)=>`<path class="${cls}" d="M${ps.map(pt).join("L")}Z"/>`;
const pline=(ps,cls="ln")=>`<path class="${cls}" d="M${ps.map(pt).join("L")}"/>`;
function box(x,y,w,d,h,z=0){
  const B0=P(x+w,y,z),C0=P(x+w,y+d,z),D0=P(x,y+d,z),A1=P(x,y,z+h),B1=P(x+w,y,z+h),C1=P(x+w,y+d,z+h),D1=P(x,y+d,z+h);
  return poly([D0,C0,C1,D1],"fl")+poly([B0,C0,C1,B1],"fr")+poly([A1,B1,C1,D1],"ft");
}
function winL(x,y,w,d,z0,h,cols,rows,cls="win"){ let s=""; const yy=y+d;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){ const u0=x+w*(i+.28)/cols,u1=x+w*(i+.72)/cols,v0=z0+h*(j+.28)/rows,v1=z0+h*(j+.72)/rows;
    s+=poly([P(u0,yy,v0),P(u1,yy,v0),P(u1,yy,v1),P(u0,yy,v1)],cls); } return s; }
function winR(x,y,w,d,z0,h,cols,rows,cls="win"){ let s=""; const xx=x+w;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){ const u0=y+d*(i+.28)/cols,u1=y+d*(i+.72)/cols,v0=z0+h*(j+.28)/rows,v1=z0+h*(j+.72)/rows;
    s+=poly([P(xx,u0,v0),P(xx,u1,v0),P(xx,u1,v1),P(xx,u0,v1)],cls); } return s; }
function gableX(x,y,w,d,h,rh){ const r0=P(x,y+d/2,h+rh), r1=P(x+w,y+d/2,h+rh);
  return poly([P(x,y,h),P(x+w,y,h),r1,r0],"ft")+poly([P(x,y+d,h),P(x+w,y+d,h),r1,r0],"fl")+poly([P(x+w,y,h),P(x+w,y+d,h),r1],"fr"); }
function gableY(x,y,w,d,h,rh){ const r0=P(x+w/2,y,h+rh), r1=P(x+w/2,y+d,h+rh);
  return poly([P(x,y,h),P(x,y+d,h),r1,r0],"ft")+poly([P(x+w,y,h),P(x+w,y+d,h),r1,r0],"fr")+poly([P(x,y+d,h),P(x+w,y+d,h),r1],"fl"); }
function pyramid(x,y,w,d,h,ph){ const ap=P(x+w/2,y+d/2,h+ph); return poly([P(x,y+d,h),P(x+w,y+d,h),ap],"fl")+poly([P(x+w,y,h),P(x+w,y+d,h),ap],"fr"); }
const E=(cx,cy,z,r)=>({c:P(cx,cy,z),rx:r*TW*.707,ry:r*TH*.707});
function cyl(cx,cy,r,h,z=0,top="ft"){ const b=E(cx,cy,z,r),t=E(cx,cy,z+h,r);
  return `<path class="fr" d="M${f1(t.c[0]-t.rx)},${f1(t.c[1])}L${f1(b.c[0]-b.rx)},${f1(b.c[1])}A${f1(b.rx)},${f1(b.ry)} 0 0 0 ${f1(b.c[0]+b.rx)},${f1(b.c[1])}L${f1(t.c[0]+t.rx)},${f1(t.c[1])}Z"/><ellipse class="${top}" cx="${f1(t.c[0])}" cy="${f1(t.c[1])}" rx="${f1(t.rx)}" ry="${f1(t.ry)}"/>`; }
function dome(cx,cy,r,z){ const t=E(cx,cy,z,r);
  return `<path class="ft" d="M${f1(t.c[0]-t.rx)},${f1(t.c[1])}A${f1(t.rx)},${f1(t.rx*.9)} 0 0 1 ${f1(t.c[0]+t.rx)},${f1(t.c[1])}A${f1(t.rx)},${f1(t.ry)} 0 0 1 ${f1(t.c[0]-t.rx)},${f1(t.c[1])}Z"/><path class="hz" d="M${f1(t.c[0]+t.rx*.25)},${f1(t.c[1]-t.rx*.82)}Q${f1(t.c[0]+t.rx*.8)},${f1(t.c[1]-t.rx*.5)} ${f1(t.c[0]+t.rx*.85)},${f1(t.c[1]-t.rx*.05)}"/>`; }
function cone(cx,cy,r,z,h){ const t=E(cx,cy,z,r), ap=P(cx,cy,z+h); return `<path class="fr" d="M${f1(t.c[0]-t.rx)},${f1(t.c[1])}A${f1(t.rx)},${f1(t.ry)} 0 0 0 ${f1(t.c[0]+t.rx)},${f1(t.c[1])}L${pt(ap)}Z"/>`; }
function flag(x,y,z,h){ const a=P(x,y,z),b=P(x,y,z+h); return pline([a,b])+`<path class="acf" d="M${pt(b)}l9,3l-9,3Z"/>`; }
function plot(x,y,w,ins,cls){ return poly([P(x+ins,y+ins),P(x+w-ins,y+ins),P(x+w-ins,y+w-ins),P(x+ins,y+w-ins)],cls); }
function treeRound(x,y,s=1){ const b=P(x,y,0),t=P(x,y,10*s); return pline([b,t])+`<circle class="ft" cx="${f1(t[0])}" cy="${f1(t[1]-5*s)}" r="${f1(6.5*s)}"/><path class="hz" d="M${f1(t[0]+1)},${f1(t[1]-9*s)}a5,5 0 0 1 3.5,6"/>`; }
function treePine(x,y,s=1){ const b=P(x,y,0); let d=`M${pt(b)}v${f1(-20*s)}`; for(let k=1;k<5;k++){ const yy=b[1]-20*s+k*4.2*s, w=1.5+k*1.8*s; d+=`M${f1(b[0])},${f1(yy-3*s)}L${f1(b[0]-w)},${f1(yy)}M${f1(b[0])},${f1(yy-3*s)}L${f1(b[0]+w)},${f1(yy)}`; } return `<path class="ln" d="${d}"/>`; }

  const tx=x+.68*w,ty=y+.36*w,tw=.22*w,th=30*w+n*3;
  s+=box(tx,ty,tw,tw,th)+pyramid(tx,ty,tw,tw,th,16*w)+winL(tx,ty,tw,tw,th*.55,th*.35,1,2);
  const ap=P(tx+tw/2,ty+tw/2,th+16*w); s+=`<path class="ln" d="M${pt(ap)}v-7M${f1(ap[0]-2.5)},${f1(ap[1]-5)}h5"/>`;

  s+=`<ellipse class="field" cx="${f1(f.c[0])}" cy="${f1(f.c[1])}" rx="${f1(f.rx)}" ry="${f1(f.ry)}"/>`;

  let posts=""; for(let k=0;k<=6*w;k++){ const a=P(x+.08+(w-.16)*k/(6*w),y+w-.08), b=P(x+w-.08,y+.08+(w-.16)*k/(6*w)); posts+=`M${pt(a)}v-4M${pt(b)}v-4`; } s+=`<path class="hz" d="${posts}"/>`;

    const g=P(mx+.3,my+.5,4); s+=`<circle class="glow" cx="${f1(g[0])}" cy="${f1(g[1])}" r="8"/>`; }

war(x,y,w,n,r){

speed(x,y,w,n,r){

  const prof=xx=>Array.from({length:N+1},(_,i)=>{ const t=Math.PI*i/N; return P(xx,y0+D/2-Math.cos(t)*D/2,Math.sin(t)*R); });

function hexPrism(cx,cy,r,h,z){ const ps=[]; for(let k=0;k<6;k++){ const a=Math.PI/6+k*Math.PI/3; ps.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]); }

function drawBuilding(b,k){
  const sig=SIG[b.c+":"+b.s]; if(sig) return sig(b.x,b.y,b.w,b.n);
  if(b.w>1) return BUILD[b.c](b.x,b.y,b.w,b.n,0);
  const all=[BUILD[b.c],...(VAR[b.c]||[])], f=all[k%all.length];
  return f===BUILD[b.c] ? f(b.x,b.y,b.w,b.n,(k*.37)%1) : f(b.x,b.y,b.w,b.n);
}

function placeTags(){
  const k=T.k, placed=[];
  DL.forEach(l=>{ l.w=l.el.offsetWidth||140; l.h=l.el.offsetHeight||26; l.gx=T.x+l.g[0]*k; l.gy=T.y+l.g[1]*k; l.tx=T.x+l.top[0]*k; l.ty=T.y+l.top[1]*k; });
  [...DL].sort((a,b)=>b.ty-a.ty).forEach(l=>{
    let y=l.ty, x=l.tx-l.w/2, moved=true, guard=0;
    while(moved&&guard++<20){ moved=false;
      if(!l.el.classList.contains("show")) break;
      for(const p of placed){ if(x<p.x+p.w+6&&x+l.w+6>p.x&&y-l.h<p.y&&y>p.y-p.h-4){ y=p.y-p.h-5; moved=true; } } }
    if(l.el.classList.contains("show")) placed.push({x,y,w:l.w,h:l.h});
    l.el.style.transform=`translate(${f1(x)}px,${f1(y-l.h)}px)`;
    l.ln.setAttribute("d",`M${f1(l.gx)},${f1(l.gy)}L${f1(l.tx)},${f1(y)}`);
    l.dot.setAttribute("cx",f1(l.gx)); l.dot.setAttribute("cy",f1(l.gy));
  });
}
/* ================= PAN & ZOOM ================= */
let T={x:0,y:0,k:1}; const KMIN=.3, KMAX=7;
function apply(){
  world.setAttribute("transform",`translate(${T.x},${T.y}) scale(${T.k})`);
  const ls=1/Math.pow(T.k,.7);
  if(typeof placeTags==="function") placeTags();
}
function fitBox(x0,y0,x1,y1,pad=50){
  const w=svg.clientWidth,h=svg.clientHeight, open=$("panel").classList.contains("open");
  const panelW=open&&w>720?380:0, sheetH=open&&w<=720?h*.55:0, topH=w>720?40:44;
  const aw=w-panelW-pad*2, ah=h-sheetH-topH-pad*2;
  const k=Math.max(KMIN,Math.min(KMAX,Math.min(aw/(x1-x0),ah/(y1-y0))));
  return {k,x:pad+(aw-(x1-x0)*k)/2-x0*k, y:topH+pad+(ah-(y1-y0)*k)/2-y0*k};
}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches; let anim=null;
function flyTo(target,ms=700){
  if(anim) cancelAnimationFrame(anim);
  if(reduce){T=target;apply();return;}
  const s={...T}, t0=performance.now();
  const step=now=>{ let u=Math.min(1,(now-t0)/ms); u=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    T={k:s.k*Math.pow(target.k/s.k,u),x:s.x+(target.x-s.x)*u,y:s.y+(target.y-s.y)*u}; apply(); if(u<1) anim=requestAnimationFrame(step); };
  anim=requestAnimationFrame(step);
}
const homeBox=()=>fitBox(100,-40,1340,890,20);
function zoomAt(f,cx,cy){ const k=Math.max(KMIN,Math.min(KMAX,T.k*f)), r=k/T.k; T={k,x:cx-(cx-T.x)*r,y:cy-(cy-T.y)*r}; apply(); }
const pts=new Map(); let moved=0, pinch=null;
svg.addEventListener("pointerdown",e=>{ pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0;
  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}; } });
svg.addEventListener("pointermove",e=>{ if(!pts.has(e.pointerId)) return;
  const p=pts.get(e.pointerId), dx=e.clientX-p.x, dy=e.clientY-p.y;
  if(pts.size===1){ moved+=Math.abs(dx)+Math.abs(dy); if(moved>4){ if(!svg.hasPointerCapture(e.pointerId)) svg.setPointerCapture(e.pointerId); svg.classList.add("dragging"); T.x+=dx;T.y+=dy;apply(); } }
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&pinch){ const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y), r=svg.getBoundingClientRect();
    zoomAt(d/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top); pinch.d=d; moved=99; } });
const up=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null; svg.classList.remove("dragging"); };
svg.addEventListener("pointerup",up); svg.addEventListener("pointercancel",up);
svg.addEventListener("wheel",e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0018)),e.clientX-r.left,e.clientY-r.top); },{passive:false});
$("zin").onclick=()=>zoomAt(1.4,svg.clientWidth/2,svg.clientHeight/2);
$("zout").onclick=()=>zoomAt(1/1.4,svg.clientWidth/2,svg.clientHeight/2);

      <div class="sub">${fmtDate(b.src.d)}</div>
    </div>
    <div class="imgs">${b.imgs.map(r=>`<h4>${esc(r.t)}</h4><p>${esc(r.d)}</p>${r.k==="comment"?`<div class="tag">From the comments, by ${esc(r.a.replace(/^Readers? on /,"a reader on "))}</div>`:""}`).join("")}</div>
    ${others.length?`<h3>This text also built</h3><ul>${others.map(o=>`<li><button type="button" data-goto="${o.i}"><span class="dot"></span>${esc(CN[o.c])}</button></li>`).join("")}</ul>`:""}`);
  $("toD").onclick=()=>{ clearSel(); openDistrict(b.c,{fly:false}); };
  const w=svg.clientWidth,h=svg.clientHeight,k=Math.max(T.k,KHOME*2.2),c=center(b), cx=w>720?(w-380)/2:w/2, cy=w>720?h/2+40:h*.3;
  flyTo({k,x:cx-c[0]*k,y:cy-c[1]*k});
}
const tip=$("tip");
svg.addEventListener("pointerover",e=>{ const g=e.target.closest(".bld"); if(!g||pts.size) return; const b=DATA.buildings[+g.dataset.b];
  tip.innerHTML=`<b>${esc(b.src.t)}</b><span>${esc(short(b.imgs[0].a))} · ${esc(CN[b.c])}</span>`; tip.style.display="block"; if(sel===null) kin(b); });
svg.addEventListener("pointermove",e=>{ if(tip.style.display!=="block") return;
  const tw=tip.offsetWidth, th=tip.offsetHeight, tag=document.querySelector(".dtag.show");
  const cands=[[e.clientX+14,e.clientY+16],[e.clientX-14-tw,e.clientY+16],[e.clientX+14,e.clientY-16-th],[e.clientX-14-tw,e.clientY-16-th]];
  let pick=cands[0];
  if(tag){ const r=tag.getBoundingClientRect(); const hit=([x,y])=>x<r.right+4&&x+tw>r.left-4&&y<r.bottom+4&&y+th>r.top-4;
    pick=cands.find(c=>!hit(c)&&c[0]>4&&c[0]+tw<innerWidth-4&&c[1]>4)||cands[0]; }
  tip.style.left=Math.max(4,Math.min(pick[0],innerWidth-tw-4))+"px"; tip.style.top=Math.max(4,pick[1])+"px"; });
svg.addEventListener("pointerout",e=>{ const g=e.target.closest(".bld"); if(!g) return; if(e.relatedTarget&&g.contains(e.relatedTarget)) return; tip.style.display="none"; if(sel===null) kin(null); else kin(DATA.buildings[sel]); });
svg.addEventListener("click",e=>{
  if(moved>4) return; tip.style.display="none";
  const g=e.target.closest(".bld"); if(g){ openBuilding(+g.dataset.b); return; }
  const d=e.target.closest("[data-d]"); if(d&&d.dataset.d){ if(focus!==d.dataset.d||sel!==null) openDistrict(d.dataset.d); return; }
  if(focus) overview();
});
svg.addEventListener("keydown",e=>{ if(e.key!=="Enter"&&e.key!==" ") return; const g=e.target.closest&&e.target.closest(".bld"); if(g){ e.preventDefault(); openBuilding(+g.dataset.b); } });
$("panel").addEventListener("click",e=>{ const b=e.target.closest("[data-goto]"); if(b){ openBuilding(+b.dataset.goto); return; } const d=e.target.closest("[data-district]"); if(d) openDistrict(d.dataset.district); });
$("panel").addEventListener("mouseover",e=>{ const d=e.target.closest("[data-district]"); if(d){ document.querySelectorAll(`[data-d="${d.dataset.district}"]`).forEach(el=>el.classList.remove("out")); hoverD=d.dataset.district; showTags(); } });
$("panel").addEventListener("mouseout",e=>{ const d=e.target.closest("[data-district]"); if(d){ hoverD=null; if(focus) setFocus(focus); else showTags(); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") back(); });


let hoverD=null;
function showTags(){ DL.forEach(l=>{ const on=l.el.dataset.d===hoverD||l.el.dataset.d===focus; [l.el,l.ln,l.dot].forEach(e=>e.classList.toggle("show",on)); }); placeTags(); }
svg.addEventListener("pointerover",e=>{ const d=e.target.closest("[data-d]"); const id=d&&d.dataset.d?d.dataset.d:null; if(id!==hoverD){ hoverD=id; showTags(); } });
svg.addEventListener("pointerleave",()=>{ hoverD=null; showTags(); });

/* ================= SEARCH ================= */
function search(){
  const q=$("q").value.trim().toLowerCase(); let hits=[];
  DATA.buildings.forEach(b=>{ const hit=!q||b.imgs.some(r=>[r.t,r.d,r.a,r.k].join(" ").toLowerCase().includes(q))||b.src.t.toLowerCase().includes(q)||CN[b.c].toLowerCase().includes(q);
    b.el.classList.toggle("dim",!!q&&!hit); if(q&&hit) hits.push(b); });
  document.querySelectorAll(".deco").forEach(d=>d.classList.toggle("dim",!!q));
  const ni=hits.reduce((s,b)=>s+b.n,0);
  $("status").textContent=q?(hits.length?`${hits.length} matching building${hits.length>1?"s":""}. Enter to frame them.`:"Nothing matches. Try a shorter word."):"";
  if(q&&focus){ clearSel(); setFocus(null); closePanel(); }
  return hits;
}
$("q").addEventListener("input",search);
$("q").addEventListener("keydown",e=>{ if(e.key!=="Enter") return; const h=search(); if(!h.length) return; if(h.length===1){ openBuilding(h[0].i); return; }
  const cs=h.map(center), xs=cs.map(c=>c[0]), ys=cs.map(c=>c[1]); flyTo(fitBox(Math.min(...xs)-60,Math.min(...ys)-70,Math.max(...xs)+60,Math.max(...ys)+40)); });

/* ================= STYLE SWITCH ================= */
const STYLES=[
 {id:"night",name:"Night engraving",traits:"hatch serif dark",a:"#060607",b:"#ECEBE4"},
 {id:"quanta",name:"Quanta",traits:"noglow skygrad",a:"#5D52D9",b:"#EF6656"},
 {id:"blueprint",name:"Blueprint",traits:"hatch mono dark noglow",a:"#1C4A82",b:"#FFD54A"},
 {id:"atlas",name:"Old atlas",traits:"hatch serif",a:"#EEE4CD",b:"#A8322D"},
 {id:"riso",name:"Risograph",traits:"noglow",a:"#2B3BAE",b:"#FF4A86"},
 {id:"neon",name:"Neon",traits:"dark skygrad",a:"#0C0220",b:"#33E6EA"}
];
$("stylemenu").innerHTML=STYLES.map(s=>`<button type="button" class="sopt" role="menuitemradio" aria-checked="false" data-style="${s.id}"><span class="swd" style="--a:${s.a};--b:${s.b}"></span>${s.name}</button>`).join("");
function styleMenu(open){ const m=$("stylemenu"), b=$("stylebtn"); m.hidden=!open; b.setAttribute("aria-expanded",open); if(open){ const cur=m.querySelector('[aria-checked="true"]')||m.querySelector(".sopt"); cur.focus(); } }
$("stylebtn").onclick=e=>{ e.stopPropagation(); if(!$("searchpop").hidden) searchPop(false); styleMenu($("stylemenu").hidden); };
document.addEventListener("click",e=>{ if(!$("stylemenu").hidden&&!e.target.closest("#stylemenu,#stylebtn")) styleMenu(false); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("stylemenu").hidden){ e.stopImmediatePropagation(); styleMenu(false); $("stylebtn").focus(); } },true);
$("stylemenu").addEventListener("keydown",e=>{ if(e.key!=="ArrowDown"&&e.key!=="ArrowUp") return; e.preventDefault(); const it=[...document.querySelectorAll(".sopt")], i=it.indexOf(document.activeElement); it[(i+(e.key==="ArrowDown"?1:it.length-1))%it.length].focus(); });

function searchPop(open){ const m=$("searchpop"); m.hidden=!open; $("searchbtn").setAttribute("aria-expanded",open); if(open){ styleMenu(false); $("q").focus(); } }
$("searchbtn").onclick=e=>{ e.stopPropagation(); searchPop($("searchpop").hidden); };
document.addEventListener("click",e=>{ if(!$("searchpop").hidden&&!e.target.closest("#searchpop,#searchbtn")) searchPop(false); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("searchpop").hidden){ e.stopImmediatePropagation(); searchPop(false); $("searchbtn").focus(); } },true);
$("q").addEventListener("input",()=>$("searchbtn").classList.toggle("active",!!$("q").value.trim()));

function toolsOpen(open){ $("tools").hidden=!open; $("toolsbtn").setAttribute("aria-expanded",open); $("toolsbtn").setAttribute("aria-label",open?"Hide controls":"Show controls");
  if(!open){ styleMenu(false); searchPop(false); } syncDot(); }
function syncDot(){ $("toolsbtn").classList.toggle("active",$("tools").hidden&&!!$("q").value.trim()); }
$("toolsbtn").onclick=e=>{ e.stopPropagation(); toolsOpen($("tools").hidden); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("tools").hidden&&$("searchpop").hidden&&$("stylemenu").hidden&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".zoom")){ e.stopImmediatePropagation(); toolsOpen(false); $("toolsbtn").focus(); } },true);
$("q").addEventListener("input",syncDot);
function setStyle(id){
  const s=STYLES.find(x=>x.id===id)||STYLES[0];
  document.body.className=s.id+" "+s.traits;
  document.querySelectorAll(".sopt").forEach(b=>b.setAttribute("aria-checked",b.dataset.style===s.id));
  $("stylebtn").style.setProperty("--a",s.a); $("stylebtn").style.setProperty("--b",s.b); apply();
  try{ localStorage.setItem("city-style",s.id); }catch(e){}
}
document.querySelectorAll(".sopt").forEach(b=>b.onclick=()=>{ setStyle(b.dataset.style); styleMenu(false); $("stylebtn").focus(); });
T=homeBox(); KHOME=T.k;
let saved=null; try{ saved=localStorage.getItem("city-style"); }catch(e){} setStyle(saved||"night");
apply(); search();
let rt; addEventListener("resize",()=>{clearTimeout(rt); rt=setTimeout(()=>{ KHOME=homeBox().k; if(!focus){T=homeBox();apply();} },150);});
</script>
